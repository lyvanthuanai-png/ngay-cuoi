<style>

:root{color-scheme:dark;--ink:#1f1a26;--panel:#1f1a26ee;--line:#574a5e;--lamp:#e3a24f;--paper:#f1e4d3;--mute:#c4b0ab;--ember:#d68a6a;--ok:#9cc98a;

[hidden]{display:none!important}

#black .big{font:500 clamp(34px,8vw,64px)/1.05 var(--display);letter-spacing:.04em;color:#f3e6d6}

.good{color:var(--ok)}.bad{color:var(--ember)}

.fade{animation:f 1.2s ease both}@keyframes f{from{opacity:0}to{opacity:1}}

let MAP=null;

function optional(){const K=kid(),out=[];
if(G.f.promise&&K)out.push({t:`Mua bánh cho ${K.ten} (tiệm bánh)`,at:[40,16.2],done:()=>G.inv.cake||G.f.gaveCake,show:()=>G.f.meeting});

function questStep(){const Q=G.Q;let n=0;while(G.qi<Q.length&&Q[G.qi].done()&&n++<5){if(Q[G.qi].on)Q[G.qi].on();G.qi++}
const box=$('#quest');let h='';
for(let i=Math.max(0,G.qi-1);i<Math.min(Q.length,G.qi+3);i++)h+=`<div class="${i<G.qi?'done':i===G.qi?'now':'next'}">${i<G.qi?'☑':i===G.qi?'▶':'☐'} ${esc(Q[i].t)}</div>`;
optional().forEach(o=>{h+=`<div class="opt">${o.done()?'☑':'☆'} ${esc(o.t)} <span class="dim">(không bắt buộc)</span></div>`});
if(box.dataset.h!==h){box.innerHTML=h;box.dataset.h=h}
const q=Q[G.qi];if(!q)return null;const a=typeof q.at==='function'?q.at():q.at;return a}

later(2.8,()=>{G.anchor=NPCS.m2.position.clone().setY(2.1);talk('Đồng nghiệp ngồi cạnh',`${PF.ten} ơi, miệng ${PF.gioi==='Nam'?'anh':'chị'} bị lệch kìa! Có sao không?`,[

later(2.5,()=>{G.anchor=NPCS.cook.position.clone().setY(2.1);talk('Cô bán cơm','Trời ơi con bị sao vậy? Mặt con đỏ hết rồi!',[

<script>
// ===== Lời nói, hội thoại =====
function say(who,text){talk(who,text)}
function talk(who,text,opts){
const self=!who;G.bub={at:self||!G.anchor?null:G.anchor.clone(),until:performance.now()+Math.max(3200,text.length*75)+(opts?6e4:0)};
const b=$('#bub');b.innerHTML=(who?`<div class="who">${esc(who)}</div>`:'')+esc(text);b.hidden=false;
const d=$('#dlg');if(!opts||!opts.length){d.hidden=true;G.dlg=false;return}
G.dlg=true;d.hidden=false;['#pad','#ta','#tj','#tr','#tbag','#help'].forEach(s=>{$(s).hidden=true});
d.innerHTML='<div class="row" id="dopts"></div>';const w=$('#dopts');
opts.forEach((o,i)=>{const bt=document.createElement('button');bt.className='btn';bt.type='button';bt.textContent=(TOUCH?'':(i+1)+'. ')+o.t;bt.onclick=()=>{closeTalk();cv.focus();if(o.f)o.f()};w.appendChild(bt)})}
function closeTalk(){const was=G.dlg;$('#dlg').hidden=true;$('#bub').hidden=true;G.dlg=false;G.bub=null;if(was&&(G.mode==='day'||G.mode==='after'))['#pad','#ta','#tj','#tr'].concat(G.mode==='day'?['#tbag']:[]).forEach(s=>{$(s).hidden=false})}
function toast(t,ms=4200){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},ms)}
function phone(){if(G.mode!=='day'||G.dlg||P.busy)return;if(!G.inv.phone){toast('Điện thoại còn để trên đầu giường.');return}
G.anchor=null;if(G.f.momMsg&&!G.f.called){const who=G.f.momMsg;talk('Tin nhắn từ '+who,'"Cuối tuần về ăn cơm không con?"',[{t:'Gọi lại',f(){act('call',3,()=>{G.f.called=1;logx('Gọi lại cho '+who,'good');talk(who,'Ừ, nhớ giữ sức khỏe nghe con. Cuối tuần về nha.')})}},{t:'Để tối gọi',f(){say('','Để tối gọi.')}}]);return}
talk('Điện thoại','Không có tin mới.')}
function hud(on){['#clock','#quest','#mini','#tq','#pad','#ta','#tj','#tr','#tbag'].forEach(s=>{$(s).hidden=!on});if(!on){$('#inv').hidden=true;$('#prompt').hidden=true;$('#help').hidden=true}}

// ===== Bắt đầu ngày =====
function startDay(){
Object.assign(G,{mode:'day',min:hm('06:30'),f:{},inv:{},money:200,qi:0,dlg:false,bub:null,anchor:null,floor:0,log:[],timers:[],cause:'',place:'',tut:{fwd:0,side:0,jump:false},tilt:0});

const other=['Mẹ','Bố'].find(q=>!famBy(q))||'Khoa (bạn thân)';later(70,()=>{G.f.momMsg=other;toast(`Có tin nhắn từ ${other}. Bấm Điện thoại (Q) để xem.`)});
// Phần thuần xui rủi: một biến cố không báo trước (giả định 8%, thêm 6% nếu có bệnh tim).
if(Math.random()<.08+(PF.hl.tim?.06:0))G.sudden=6+Math.floor(Math.random()*(G.Q.length-8));else G.sudden=-1;
const h=$('#help');h.hidden=false;h.textContent=TOUCH?'▲▼ đi tới, lùi · ◀▶ đi ngang · ⟲⟳ quay · kéo màn hình để nhìn · chạm vào chỗ muốn tới':'W/S đi tới, lùi · A/D đi ngang · ← → quay · kéo chuột để nhìn · Space nhảy · Shift chạy · E hành động · I túi đồ · Q điện thoại';
setTimeout(()=>{h.hidden=true},16000);toast(`06:30 · Nhà ${PF.ten}, ${PF.quan}, ${PF.thanhPho}`,4000);cv.focus()}
function placeAt(){const loc=`${PF.quan}, ${PF.thanhPho}`;
if(G.floor===12)return (P.x>76&&P.z<-50?'phòng họp tầng 12, ':'tầng 12, ')+PF.congTy+', '+loc;
if(P.z>=0&&P.z<=8)return 'giữa đường trước '+PF.congTy+', '+loc;
if(P.x>16&&P.x<26&&P.z>12&&P.z<20)return 'quán cơm tấm, '+loc;

if(P.x>36&&P.x<62&&P.z<-4&&P.z>-26)return 'sảnh '+PF.congTy+', '+loc;
return 'trên đường đi làm, '+loc}
function survive(){G.mode='end';hud(false);closeTalk();
const s=$('#sheet');s.hidden=false;const risks=G.log.filter(l=>l.kind==='risk');
s.innerHTML=`<h2>Hôm nay bạn về nhà an toàn.</h2><p class="card-p">${esc(PF.ten)} ăn tối cùng ${PF.fam.length?'gia đình':'chính mình'} lúc 19:00. ${G.f.gaveCake?esc(kid().ten)+' ôm hộp bánh chạy khắp nhà. ':''}Một ngày bình thường.</p>
${risks.length?`<p>Nhưng hôm nay có ${risks.length} lần bạn suýt gặp chuyện:</p><ul>${risks.map(l=>`<li class="bad">${l.t} · ${esc(l.text)}</li>`).join('')}</ul>`:'<p class="good">Hôm nay bạn không đi vào rủi ro nào.</p>'}
<button class="btn main" type="button" id="go">Xem bài học hôm nay</button>`;$('#go').onclick=()=>lesson(null)}

setTimeout(()=>{b.innerHTML=`<div class="big fade" style="color:var(--ok)">BẠN ĐƯỢC CỨU KỊP</div><div class="cause fade">${esc(CAUSE[kind].name)}</div>
<p class="why fade">Xe cấp cứu tới. Bác sĩ nói nhờ gọi ngay khi vừa thấy dấu hiệu nên còn kịp. ${PF.fam.length?esc(PF.fam[0].ten)+' chạy vào viện, nắm tay bạn.':''}</p><button class="btn main fade" id="bn" type="button" style="max-width:260px">Xem bài học hôm nay</button>`;$('#bn').onclick=()=>lesson(kind)},1800)}
</script>

${extra.length?`<p><b>Những lần suýt gặp chuyện</b></p><ul>${extra.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
${C?C.quiz.map((q,i)=>`<div class="q" data-q="${i}"><b>${esc(q[0])}</b><div class="row">${q[1].map((a,j)=>`<button class="chip" type="button" data-a="${j}">${esc(a)}</button>`).join('')}</div><div class="dim" data-r></div></div>`).join(''):''}
<p class="dim">Nội dung tham khảo cho trò chơi, chưa được bác sĩ duyệt, không thay lời khuyên y tế. Cấp cứu: gọi 115. Nếu trò chơi làm bạn thấy nặng lòng, hãy nói chuyện với người bạn tin tưởng.</p>
<div class="card-p" id="share">Tôi vừa sống "ngày cuối" của một ${esc(jobName(PF.nghe).toLowerCase())}${C?', ra đi vì '+esc(C.name.toLowerCase()):''}. Điều tôi học được: ${C?C.tips[0].replace(/<[^>]+>/g,''):'chờ đèn xanh, đứng dậy vận động, ăn sáng đủ.'}</div>
<div class="row" style="flex-wrap:nowrap"><button class="btn" type="button" id="cp" style="width:auto">Sao chép để chia sẻ</button><button class="btn" type="button" id="again" style="width:auto">Chơi lại ngày này</button><button class="btn main" type="button" id="newp">Hồ sơ khác</button></div>`;
if(C)s.querySelectorAll('.q').forEach(d=>{const q=C.quiz[+d.dataset.q];d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.a===q[2];d.querySelector('[data-r]').innerHTML=ok?'<span class="good">Đúng.</span>':'<span class="bad">Chưa đúng. Đáp án: '+esc(q[1][q[2]])+'.</span>'})});
$('#cp').onclick=()=>{try{navigator.clipboard.writeText($('#share').textContent);toast('Đã sao chép.',2000)}catch(_){toast('Không sao chép được trên trình duyệt này.',2500)}};
$('#again').onclick=()=>{s.hidden=true;startDay()};$('#newp').onclick=()=>{s.hidden=true;WP=0;wizard()}}
</script>
<script>
// ===== Điều khiển =====
const keys={},padK={};
const GAMEKEYS=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight'];
addEventListener('keydown',e=>{const tag=e.target.tagName;if(tag==='INPUT'||tag==='SELECT')return;keys[e.code]=true;
if(GAMEKEYS.includes(e.code)&&(G.mode==='day'||G.mode==='after'))e.preventDefault();if(e.repeat)return;
const dg=/^Digit([1-4])$/.exec(e.code);if(dg&&G.dlg){const b=document.querySelectorAll('#dopts .btn')[dg[1]-1];if(b)b.click();return}
if(e.code==='KeyE')useItem();if(e.code==='KeyQ')phone();if(e.code==='KeyV')P.first=!P.first;if(e.code==='KeyI')toggleInv();
if(e.code==='Space'&&P.ground&&!P.busy&&(G.mode==='day'||G.mode==='after')){P.vy=7.4;if(G.tut)G.tut.jump=true}});
addEventListener('keyup',e=>{keys[e.code]=false});
document.querySelectorAll('#pad .tb').forEach(b=>{const k=b.dataset.k,off=()=>{padK[k]=false;b.classList.remove('on')};
b.addEventListener('pointerdown',e=>{e.preventDefault();padK[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}});
b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('contextmenu',e=>e.preventDefault())});
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}cv.focus()});
cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);
if(drag.moved>8){P.yaw-=dx*.005;P.pitch=Math.max(-1.2,Math.min(1.1,P.pitch-dy*.004))}drag.x=e.clientX;drag.y=e.clientY});
cv.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId){if(drag.moved<=8)clickAt(e.clientX,e.clientY);drag=null}});
cv.addEventListener('pointercancel',()=>{drag=null});
$('#ta').onclick=()=>useItem();$('#tj').onclick=()=>{if(P.ground&&!P.busy){P.vy=7.4;if(G.tut)G.tut.jump=true}};$('#tq').onclick=()=>phone();$('#tbag').onclick=()=>toggleInv();
let runOn=false;$('#tr').onclick=()=>{runOn=!runOn;$('#tr').classList.toggle('on',runOn)};
function toggleInv(){if(G.mode!=='day')return;const e=$('#inv');renderInv();e.hidden=!e.hidden}
const ray=new THREE.Raycaster(),v2=new THREE.Vector2(),v3=new THREE.Vector3(),gPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function itemPos(i){if(i.npc!==undefined){const g=typeof i.npc==='number'?NPCS[i.npc]:NPCS[i.npc];if(g)return [g.position.x,g.position.z]}return [i.x,i.z]}
function activeItems(){return G.items.filter(i=>!i.on||i.on())}
function clickAt(cx,cy){if((G.mode!=='day'&&G.mode!=='after')||P.busy||G.dlg)return;let best=null,bd=56;
activeItems().forEach(i=>{const [x,z]=itemPos(i);v3.set(x,(i.y||1.8)-.6,z).project(camera);if(v3.z>1)return;const d=Math.hypot((v3.x+1)/2*innerWidth-cx,(1-v3.y)/2*innerHeight-cy);if(d<bd){bd=d;best=i}});
if(best){const [x,z]=itemPos(best);P.goto={x,z,item:best,t:0};return}
v2.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(v2,camera);gPlane.constant=-P.y;if(ray.ray.intersectPlane(gPlane,v3))P.goto={x:v3.x,z:v3.z,item:null,t:0}}
function nearest(){let best=null,bd=2.4;activeItems().forEach(i=>{const [x,z]=itemPos(i);const d=Math.hypot(x-P.x,z-P.z);if(d<bd){bd=d;best=i}});return best}
function useItem(n){if((G.mode!=='day'&&G.mode!=='after')||G.dlg||P.busy)return;n=n||nearest();if(!n)return;const [x,z]=itemPos(n);G.anchor=new THREE.Vector3(x,n.y||1.8,z);n.use()}
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));

// ===== Bản đồ nhỏ =====
function drawMini(tgt){const c=$('#mini'),g=c.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#2a2430';g.fillRect(0,0,150,110);
if(!MAP)return;const s=2.4,w=150/s,h=110/s;g.drawImage(MAP.c,P.x-MAP.x0-w/2,P.z-MAP.z0-h/2,w,h,0,0,150,110);
if(tgt){let tx=75+(tgt[0]-P.x)*s,tz=55+(tgt[1]-P.z)*s;tx=Math.max(5,Math.min(145,tx));tz=Math.max(5,Math.min(105,tz));g.fillStyle='#e3a24f';g.beginPath();g.arc(tx,tz,4.5,0,7);g.fill();g.strokeStyle='#2a1c10';g.stroke()}
g.save();g.translate(75,55);g.rotate(-P.yaw+Math.PI);g.fillStyle='#fff';g.beginPath();g.moveTo(0,-6);g.lineTo(4.5,4.5);g.lineTo(-4.5,4.5);g.closePath();g.fill();g.restore()}

// ===== Giờ và ánh sáng =====
const SKY=[[360,0xf2d6c0,.75,.5],[480,0xcfe3ea,.85,.7],[720,0xa8d4ec,.95,.8],[1020,0xe0a878,.75,.55],[1110,0x7a5a7a,.5,.25],[1200,0x1b2236,.32,.08],[1440,0x1b2236,.32,.08]];
const ca=new THREE.Color(),cb=new THREE.Color();
function sky(m){let i=0;while(i<SKY.length-2&&m>SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1],t=Math.max(0,Math.min(1,(m-a[0])/(b[0]-a[0])));
ca.setHex(a[1]).lerp(cb.setHex(b[1]),t);scene.fog.color.copy(ca);
hemi.color.set(0xffffff);hemi.groundColor.set(0x665544);sun.color.set(0xffffff);
hemi.intensity=(a[2]+(b[2]-a[2])*t)*.72;sun.intensity=(a[3]+(b[3]-a[3])*t)*1.1;
const ang=Math.max(.25,Math.min(Math.PI-.25,(m-360)/(1140-360)*Math.PI));sunBox.position.set(P.x+Math.cos(ang)*170,Math.sin(ang)*120,P.z-40);sunBox.material.color.set(0xfff2c8);
sun.position.set(P.x+Math.cos(ang)*50,Math.sin(ang)*60,P.z-14);sun.target.position.set(P.x,0,P.z);
skyMat.uniforms.bot.value.copy(ca);skyMat.uniforms.top.value.copy(ca).lerp(cb.setHex(m<1100?0x3f78c0:0x1a1f3a),.55);cloudMat.color.copy(ca).lerp(cb.setHex(0xffffff),.7)}

// ===== Vòng lặp =====
let last=performance.now(),miniT=0,idle=0,lastQi=-1;
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.1,(now-last)/1000);last=now;step(dt,now)}
// Một bước mô phỏng; tách riêng để có thể tua nhanh khi kiểm thử.
function step(dt,now){
if(G.mode==='black'||G.mode==='fade')return;
const live=G.mode==='day'||G.mode==='after';
CLOUDS.forEach(g=>{g.position.x+=dt*1.2;if(g.position.x>170)g.position.x=-70});
if(G.mode==='day'||G.mode==='menu'){lightStep(dt);vehStep(dt);if(G.mode!=='day')return render(now);
NPCS.walkers.forEach(w=>{w.position.x+=w.d*1.3*dt;if(w.position.x>98)w.position.x=-18;if(w.position.x<-18)w.position.x=98;const s=Math.sin(now*.009+w.d)*.6;w.lL.rotation.x=s;w.lR.rotation.x=-s;w.aL.rotation.x=-s;w.aR.rotation.x=s})}
if(G.mode==='day'){
G.min+=dt*1;$('#clock').textContent=fmt(G.min);sky(G.min);
const due=[];G.timers=G.timers.filter(t=>{t.t-=dt;if(t.t<=0){due.push(t);return false}return true});due.forEach(t=>t.f());
if(G.mode!=='day')return;
const tgt=questStep();if(G.qi!==lastQi){lastQi=G.qi;idle=0;if(G.qi===G.sudden){G.sudden=-1;cv.style.filter='blur(2px) grayscale(.6)';say('','Ngực... đau quá...');later(1.6,()=>die('cardiac'))}}
if(G.inHome===undefined)G.inHome=false;const inHome=P.x>0&&P.x<14&&P.z>14&&P.z<26;if(inHome&&G.f.meeting&&G.floor===0)G.f.home=1;
const onRoad=P.z>=0&&P.z<=8&&G.floor===0;if(onRoad&&LIGHT.ped!=='g'&&!G.f.jay){G.f.jay=1;logx(P.x>=CW[0]&&P.x<=CW[1]?'Qua đường khi đèn đi bộ chưa xanh':'Băng qua đường không có vạch kẻ','risk')}
const mk=PROPS.mark;mk.visible=!!tgt&&Math.hypot(tgt[0]-P.x,tgt[1]-P.z)>1.8;if(mk.visible){mk.position.set(tgt[0],(G.floor===12||P.z>14||P.z<-4?2.7:3.4)+Math.sin(now*.004)*.2,tgt[1]);mk.rotation.y=now*.002}
const dx0=tgt?tgt[0]-P.x:0,dz0=tgt?tgt[1]-P.z:0,dl=Math.hypot(dx0,dz0);
PROPS.trail.forEach((d,i)=>{const s=1.4+i*1.3;d.visible=!!tgt&&s<dl-.8;if(d.visible){d.position.set(P.x+dx0/dl*s,P.y+.04,P.z+dz0/dl*s);d.material.opacity=.35+.45*Math.max(0,Math.sin(now*.006-i*.7))}});
idle+=dt;if(idle>20&&tgt&&!G.dlg){idle=0;toast('Gợi ý: đi theo vệt sáng dưới đất và mũi tên vàng tới chỗ cần tới. Lại gần rồi bấm '+(TOUCH?'nút sáng màu':'E')+'.',5000)}
if((miniT+=dt)>.15){miniT=0;drawMini(tgt)}}
if(G.mode==='after'){sun.position.set(P.x+50,30,P.z-15);sun.target.position.set(P.x,0,P.z)}
let l=0;
if(live&&P.busy){P.busy.t-=dt;if(P.busy.t<=0){const d=P.busy.done;P.busy=null;if(d)d()}}
else if(live){
let fx=0,fz=0;
if(keys.KeyW||keys.ArrowUp||padK.f)fz+=1;if(keys.KeyS||keys.ArrowDown||padK.b)fz-=1;if(keys.KeyA||padK.l)fx-=1;if(keys.KeyD||padK.r)fx+=1;
const turn=(keys.ArrowLeft||padK.tl?1:0)-(keys.ArrowRight||padK.tr?1:0);P.yaw+=turn*2.4*dt;
if(fx||fz||turn){P.goto=null;idle=0}
if(P.goto){const g=P.goto,dx=g.x-P.x,dz=g.z-P.z,d=Math.hypot(dx,dz);
if(d<(g.item?1.7:.35)){P.goto=null;if(g.item)useItem(g.item)}
else{const df=wrap(Math.atan2(dx,dz)-P.yaw);P.yaw+=Math.max(-7*dt,Math.min(7*dt,df));fz=Math.abs(df)<1?1:.15;g.t+=dt;if(g.t>30)P.goto=null}}
l=Math.hypot(fx,fz);if(l>1){fx/=l;fz/=l}
const run=keys.ShiftLeft||keys.ShiftRight||runOn,sp=(G.mode==='after'?3.4:4.4)*(run?1.6:1);
const sn=Math.sin(P.yaw),cs=Math.cos(P.yaw),mx=(sn*fz-cs*fx)*sp*dt,mz=(cs*fz+sn*fx)*sp*dt;
if(G.tut){if(fz>0)G.tut.fwd+=sp*dt*fz;if(fx)G.tut.side+=sp*dt*Math.abs(fx)}
let blocked=false;if(!hit(P.x+mx,P.y,P.z))P.x+=mx;else blocked=true;if(!hit(P.x,P.y,P.z+mz))P.z+=mz;else blocked=true;
if(blocked&&P.ground&&(mx||mz)&&!hit(P.x+Math.sign(mx)*.15,P.y+1.05,P.z+Math.sign(mz)*.15))P.vy=7.4}
if(live){
P.vy-=22*dt;let ny=P.y+P.vy*dt;P.ground=false;
if(ny<=0){ny=0;P.vy=0;P.ground=true}else if(hit(P.x,ny,P.z)){if(P.vy<0){ny=Math.ceil(ny);P.ground=true}else ny=P.y;P.vy=0}
P.y=ny;
const moving=l>.05;P.walk+=moving?dt*9*(keys.ShiftLeft||runOn?1.5:1):0;const sw=moving?Math.sin(P.walk)*.65:0;
if(P.mesh){if(P.busy)pose(P.mesh,P.busy.pose,now);else{P.mesh.rotation.x=0;P.mesh.aL.rotation.z=P.mesh.aR.rotation.z=0;P.mesh.aL.rotation.x=sw;P.mesh.aR.rotation.x=P.held?-.5:-sw;P.mesh.lL.rotation.x=-sw;P.mesh.lR.rotation.x=sw}}
const n=P.busy||G.dlg?null:nearest(),pr=$('#prompt'),ta=$('#ta');
if(n){pr.hidden=false;pr.textContent=(TOUCH?'':'E: ')+n.hint;ta.textContent=n.verb;ta.classList.add('has')}else{pr.hidden=true;ta.textContent='Hành động';ta.classList.remove('has')}
NPCS.forEach(g=>{if(g.d)return;const dx=P.x-g.position.x,dz=P.z-g.position.z;if(dx*dx+dz*dz<30&&G.mode==='day')g.rotation.y+=wrap(Math.atan2(dx,dz)-g.rotation.y)*Math.min(1,dt*5)})}
render(now)}
function render(now){
if(P.mesh){const sitY=P.busy&&(P.busy.pose==='sit'||P.busy.pose==='kneel'||P.busy.pose==='pray'||P.busy.pose==='bow')?-.5:0;P.mesh.position.set(P.x,P.y+sitY,P.z);P.mesh.rotation.y=P.yaw;P.mesh.visible=!(P.first&&(G.mode==='day'||G.mode==='after'))}
const h=P.h-.15,dx=Math.sin(P.yaw)*Math.cos(P.pitch),dy=Math.sin(P.pitch),dz=Math.cos(P.yaw)*Math.cos(P.pitch);
if(G.mode==='menu'){const a=now*.0004,wide=innerWidth>=760,o=wide?1.1:0;camera.position.set(P.x+o+Math.sin(a)*.4,P.y+1.45,P.z+3.2);camera.lookAt(P.x+o,P.y+(wide?1.05:.45),P.z)}
else if(G.mode==='review'||G.mode==='end'){const a=now*.00012;camera.position.set(7+Math.cos(a)*26,18,20+Math.sin(a)*26);camera.lookAt(7,0,18)}
else if(P.first){camera.position.set(P.x,P.y+h,P.z);camera.lookAt(P.x+dx,P.y+h+dy,P.z+dz)}
else{const up=camera.aspect<1?.9:.45,mx=camera.aspect<1?5.5:5;let d=.5;while(d<mx){const cx=P.x-dx*d,cy=P.y+h-dy*d+up,cz=P.z-dz*d,k=key(Math.floor(cx),Math.floor(cy),Math.floor(cz));if(solid.has(k)||cy<.2||blocks.has(k))break;d+=.15}d=Math.max(.4,d-.2);camera.position.set(P.x-dx*d,P.y+h-dy*d+up,P.z-dz*d);camera.lookAt(P.x+dx,P.y+h+dy-up*.35,P.z+dz)}
camera.rotation.z+=G.tilt?Math.sin(now*.002)*G.tilt:0;
dome.position.copy(camera.position);
if(G.bub){const b=$('#bub');if(now>G.bub.until||(G.dlg&&G.bub.at&&Math.hypot(G.bub.at.x-P.x,G.bub.at.z-P.z)>8))closeTalk();
else{const a=G.bub.at;if(a)v3.copy(a);else v3.set(P.x,P.y+P.h+.3,P.z);v3.project(camera);
if(v3.z>1)b.hidden=true;else{b.hidden=false;b.style.left=Math.max(90,Math.min(innerWidth-90,(v3.x+1)/2*innerWidth))+'px';b.style.top=Math.max(70,(1-v3.y)/2*innerHeight-8)+'px'}}}
renderer.render(scene,camera)}
PF=loadPF();wizard();requestAnimationFrame(tick);
</script>
