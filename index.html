<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>Ngày cuối</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sống một ngày đi làm của chính bạn, gặp rủi ro thật của nghề, rồi học cách phòng tránh.">
<meta name="theme-color" content="#07060e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Spectral:wght@300;400;500&display=swap">
<style>
/* Hệ màu: nền sâu + sương tím/xanh. Mọi màu lấy từ token này. */
:root{color-scheme:dark;--void:#07060e;--ink:#0e0c1a;--glass:rgba(20,17,38,.68);--glass2:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);--text:#f4f2ff;--mute:#b3aed0;
--violet:#9483ff;--cyan:#5ce6ff;--rose:#ff7fa9;--amber:#ffc56e;--ok:#62f0b5;--danger:#ff6b80;--grad:linear-gradient(120deg,#a08fff,#5ce6ff);--on-grad:#0a0816;--r:18px;--cs:1;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
--display:"Spectral",Georgia,serif;--body:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--void);color:var(--text);font:400 16px/1.5 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
canvas#g{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;transition:filter 1.2s}
.pn{position:fixed;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.noblur .pn,.noblur .tb,.noblur .card{-webkit-backdrop-filter:none;backdrop-filter:none;background:#15122a}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.pn{background:#15122a}}
@media(prefers-reduced-transparency:reduce){.pn,.tb,.card{-webkit-backdrop-filter:none;backdrop-filter:none;background:#15122a}}
button{font:inherit;color:inherit}
button,.chip,.sw,.tb,.btn{transition:transform .14s var(--ease),background .2s,border-color .2s,box-shadow .2s}
button:active{transform:scale(.94)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* HUD tĩnh: một dòng nhiệm vụ, chạm để mở danh sách */
#clock{top:calc(10px + var(--safe-t));left:max(12px,var(--safe-l));padding:3px 11px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;border-radius:99px}
#quest{top:calc(44px + var(--safe-t));left:max(12px,var(--safe-l));padding:8px 13px;font-size:14px;width:min(350px,calc(100vw - 132px));cursor:pointer;touch-action:manipulation}
#quest .now{font-weight:600;font-size:15px;line-height:1.3}
#quest .now:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);vertical-align:1px}
#quest .more{display:none;margin-top:6px;border-top:1px solid var(--line);padding-top:6px;color:var(--mute);font-size:13px}
#quest.open .more{display:block}
#quest .done{text-decoration:line-through;opacity:.7}#quest .opt{color:var(--amber)}
#quest .bar{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mute);margin-top:5px}
#quest .bar i{flex:1;height:5px;border-radius:3px;background:var(--glass2);overflow:hidden;display:block}#quest .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--danger));transition:width .3s}
#quest.pulse{animation:pulse .7s var(--ease)}@keyframes pulse{30%{box-shadow:0 0 0 2px var(--cyan),0 0 26px rgba(92,230,255,.55)}}
#mini{position:fixed;top:calc(10px + var(--safe-t));right:max(12px,var(--safe-r));width:96px;height:96px;border:1px solid var(--line);border-radius:50%;background:var(--ink);image-rendering:pixelated}
.ib{position:fixed;right:max(12px,var(--safe-r));width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);cursor:pointer;touch-action:manipulation}
.ib svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tq{top:calc(116px + var(--safe-t))}#tbag{top:calc(170px + var(--safe-t))}#tset{top:calc(224px + var(--safe-t))}
#toast{top:calc(10px + var(--safe-t));left:50%;transform:translateX(-50%);padding:7px 14px;font-size:14px;width:max-content;max-width:min(52vw,420px);text-align:center;z-index:5;animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;translate:0 -6px}to{opacity:1;translate:0 0}}
@media(max-width:600px){#toast{top:calc(118px + var(--safe-t));left:12px;transform:none;max-width:calc(100vw - 84px)}}
#prompt{bottom:calc(196px + var(--safe-b));left:50%;transform:translateX(-50%);padding:6px 14px;font-size:14px;border-radius:99px;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#bub{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:rgba(244,242,255,.96);color:#14112a;border-radius:14px;padding:8px 13px;max-width:min(300px,72vw);font:400 16px/1.38 var(--body);pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#bub .who{color:#5b46d6;font:600 12px var(--body)}
#bub:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:rgba(244,242,255,.96)}
#dlg{left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));width:min(560px,calc(100vw - 24px));z-index:6}
#dlg .row{display:flex;flex-wrap:wrap;gap:8px}#dlg .btn{width:auto;flex:1 1 auto;min-height:52px}
.btn{min-height:48px;padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:var(--glass2);cursor:pointer;text-align:center;width:100%;font-weight:500}
.btn:hover{border-color:rgba(255,255,255,.3)}
.main{background:var(--grad);border:0;color:var(--on-grad);font-weight:700;box-shadow:0 8px 34px rgba(120,130,255,.35)}
/* Điều khiển: cỡ chỉnh bằng --cs, vùng chạm tối thiểu 56px */
.tb{position:fixed;background:var(--glass);border:1px solid var(--line);font:600 13px var(--body);cursor:pointer;touch-action:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tb.on,.tb:active{background:var(--grad);color:var(--on-grad);border-color:transparent}
#pad{position:fixed;left:max(10px,var(--safe-l));bottom:calc(12px + var(--safe-b));display:grid;grid-template-columns:repeat(3,calc(58px*var(--cs)));grid-template-rows:repeat(2,calc(58px*var(--cs)));gap:3px}
#pad .tb{position:static;font-size:20px;border-radius:16px}#pad .rot{opacity:.8}
#ta{right:max(12px,var(--safe-r));bottom:calc(14px + var(--safe-b));width:calc(86px*var(--cs));height:calc(86px*var(--cs));border-radius:50%;font-size:14px;line-height:1.15;padding:4px}
#ta.has{background:var(--grad);color:var(--on-grad);border-color:transparent;box-shadow:0 0 34px rgba(92,230,255,.55);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 14px rgba(92,230,255,.3)}}
#tj{right:calc(max(12px,var(--safe-r)) + 92px*var(--cs));bottom:calc(10px + var(--safe-b));width:calc(58px*var(--cs));height:calc(58px*var(--cs));border-radius:50%}
#tr{right:calc(max(12px,var(--safe-r)) + 72px*var(--cs));bottom:calc(10px + var(--safe-b) + 92px*var(--cs));width:calc(58px*var(--cs));height:calc(58px*var(--cs));border-radius:50%}
.left #pad{left:auto;right:max(10px,var(--safe-r))}.left #ta{right:auto;left:max(12px,var(--safe-l))}.left #tj{right:auto;left:calc(max(12px,var(--safe-l)) + 92px*var(--cs))}.left #tr{right:auto;left:calc(max(12px,var(--safe-l)) + 72px*var(--cs))}.left #joyz{left:auto;right:0}
.joy #pad{display:none!important}
#joyz{position:fixed;left:0;bottom:0;width:52vw;height:56vh;touch-action:none;display:none}.joy #joyz{display:block}
#joyb{position:fixed;width:calc(132px*var(--cs));height:calc(132px*var(--cs));margin:calc(-66px*var(--cs)) 0 0 calc(-66px*var(--cs));border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:radial-gradient(circle,rgba(148,131,255,.2),rgba(92,230,255,.05));pointer-events:none;opacity:.5;transition:opacity .15s}
#joyb.act{opacity:1}#joyn{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:var(--grad);box-shadow:0 0 22px rgba(92,230,255,.6)}
#inv{right:max(68px,var(--safe-r));top:calc(116px + var(--safe-t));width:210px;font-size:14px}
#help{bottom:calc(196px + var(--safe-b));left:12px;right:12px;width:auto;padding:7px 12px;font-size:12px;color:var(--mute);text-align:center}
#flash{position:fixed;inset:0;background:#dfe6ff;opacity:0;pointer-events:none;transition:opacity .15s}
.ft{position:fixed;left:0;top:0;font-weight:700;font-size:17px;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.65);animation:ft 1.1s var(--ease) forwards;white-space:nowrap;z-index:4}
@keyframes ft{0%{opacity:0;transform:translate(-50%,0) scale(.7)}18%{opacity:1;transform:translate(-50%,-14px) scale(1.08)}100%{opacity:0;transform:translate(-50%,-62px) scale(1)}}
/* Màn chào */
#splash{position:fixed;inset:0;z-index:30;background:var(--void);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + var(--safe-t)) 22px calc(20px + var(--safe-b));overflow:hidden;transition:opacity .45s,transform .6s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06)}
.mist{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.m1{width:70vmax;height:70vmax;left:-28vmax;top:-30vmax;background:#4a32c8;animation:d1 14s ease-in-out infinite alternate}
.m2{width:60vmax;height:60vmax;right:-26vmax;bottom:-24vmax;background:#0e8fb0;animation:d2 17s ease-in-out infinite alternate}
.m3{width:38vmax;height:38vmax;right:6vmax;top:12vh;background:#b73a78;opacity:.3;animation:d1 20s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.12)}}@keyframes d2{to{transform:translate(-8vmax,-9vmax) scale(1.08)}}
.noblur .mist{filter:blur(36px)}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;width:min(420px,100%);gap:14px}
.title{font:300 clamp(54px,15vw,100px)/1.02 var(--display);letter-spacing:-.01em;margin:0}
.title{white-space:normal}.title .w{white-space:nowrap}.title span{display:inline-block;opacity:0;transform:translateY(18px);filter:blur(8px);animation:ch .8s var(--ease) forwards}
@keyframes ch{to{opacity:1;transform:none;filter:none}}
.tag{font-size:17px;color:var(--mute);opacity:0;animation:fi .9s .9s forwards;margin:0}@keyframes fi{to{opacity:1}}
.load{width:150px;height:3px;border-radius:2px;background:var(--glass2);overflow:hidden;margin:10px 0;transition:opacity .3s}.load i{display:block;height:100%;width:0;background:var(--grad);box-shadow:0 0 12px var(--cyan)}
#splash.ready .load{opacity:0}
.sp-act{display:flex;flex-direction:column;gap:10px;width:100%;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .5s,transform .5s var(--ease)}
#splash.ready .sp-act{opacity:1;transform:none;pointer-events:auto}
.sp-act .main{min-height:58px;font-size:18px;border-radius:18px}.sp-act .sub{font-size:13px;font-weight:500;opacity:.75;display:block}
.warn{font-size:12px;color:var(--mute);margin:6px 0 0}
.lang{position:absolute;top:calc(14px + var(--safe-t));right:14px;display:flex;padding:3px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);z-index:2}
.lang button{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 13px;border:0;background:none;border-radius:99px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mute)}
.lang button.on{background:rgba(255,255,255,.14);color:var(--text)}.lang svg{width:20px;height:14px;border-radius:2px;display:block}
.sp-gear{position:absolute;top:calc(14px + var(--safe-t));left:14px;z-index:2;right:auto}
/* Showroom */
#wiz{position:fixed;inset:0;z-index:10;pointer-events:none}
#wiz>*{pointer-events:auto}
.top{position:absolute;left:12px;right:12px;top:calc(10px + var(--safe-t));display:flex;gap:8px;align-items:center}
.top .ib{position:static;flex:none}
.top input{flex:1;min-width:0;height:48px;text-align:center;font:500 18px var(--display);background:var(--glass);border:1px solid var(--line);border-radius:14px;color:var(--text);-webkit-user-select:text;user-select:text}
.stats{position:absolute;left:12px;top:calc(68px + var(--safe-t));width:150px;padding:10px 12px;background:var(--glass);border:1px solid var(--line);border-radius:16px;font-size:11.5px;color:var(--mute)}
.stat{margin-bottom:7px}.stat i{display:block;height:6px;border-radius:3px;background:var(--glass2);overflow:hidden;margin-top:3px}.stat b{display:block;height:100%;background:var(--grad);transition:width .5s var(--ease)}
.stats small{font-size:10px;opacity:.8}
.sheet{position:absolute;left:0;right:0;bottom:0;height:min(53vh,470px);background:var(--glass);border-top:1px solid var(--line);border-radius:24px 24px 0 0;display:flex;flex-direction:column;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding-bottom:var(--safe-b);animation:up .5s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.noblur .sheet{background:#15122a;-webkit-backdrop-filter:none;backdrop-filter:none}
@media(min-width:760px){.sheet{left:auto;top:12px;right:12px;bottom:12px;width:430px;height:auto;border:1px solid var(--line);border-radius:24px;padding-bottom:0}.top{right:454px}.tabs{justify-content:space-between}.tabs button{padding:0 10px}}
.tabs{display:flex;gap:4px;padding:10px 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:44px;padding:0 15px;border-radius:12px;border:0;background:none;color:var(--mute);font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.12);color:var(--text)}
.tbody{flex:1;overflow-y:auto;padding:6px 14px 12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;animation:fi2 .3s}@keyframes fi2{from{opacity:0;transform:translateY(6px)}}
.cta{flex:none;padding:8px 14px 12px}.cta .main{min-height:56px;font-size:17px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px}.w2{grid-column:span 2}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;min-height:56px;position:relative}
.card.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px rgba(92,230,255,.22)}
.card b{display:block;font-size:14px;font-weight:600;line-height:1.25}.card small{color:var(--mute);font-size:12px;display:block;margin-top:2px}
.dng{display:flex;gap:3px;margin-top:6px}.dng i{width:13px;height:3px;border-radius:2px;background:var(--glass2)}.dng i.f{background:var(--rose)}
.fact{font-size:13px;color:var(--mute);border-left:2px solid var(--cyan);padding-left:10px;margin:0}.fact small{font-size:11.5px;display:block;opacity:.85;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:14px;min-height:44px;padding:4px 15px;border:1px solid var(--line);border-radius:12px;background:var(--glass2);cursor:pointer}
.chip.on{border-color:var(--cyan);color:var(--cyan)}
.sw{width:44px;height:44px;border:3px solid transparent;border-radius:12px;cursor:pointer;padding:0;background-clip:padding-box;box-shadow:inset 0 0 0 1px var(--line)}.sw.on{box-shadow:0 0 0 2px var(--cyan)}
.fld{display:flex;flex-direction:column;gap:5px}.lbl{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:10px}
input[type=text],input[type=number],select{font:inherit;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:46px;-webkit-user-select:text;user-select:text}
select option{background:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:none;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--violet) var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--violet) var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.45),0 0 0 4px rgba(148,131,255,.35)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border:0;border-radius:50%;background:#fff}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:14px;padding:8px;position:relative}
.fam .x{position:absolute;right:0;top:-6px;width:40px;height:40px;background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer}
.ck{display:flex;gap:10px;align-items:center;font-size:14px;min-height:44px;cursor:pointer}.ck input{width:22px;height:22px;accent-color:var(--violet)}
.dim{color:var(--mute);font-size:13px;margin:0}
/* Cài đặt */
#set{position:fixed;inset:0;z-index:40;background:rgba(5,4,12,.72);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b))}
.set-in{width:min(640px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;animation:up .35s var(--ease)}
.set-h{display:flex;align-items:center;justify-content:space-between}.set-h h2{margin:0;font:400 28px var(--display)}.set-h .ib{position:static}
.set-b{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:6px;grid-column:span 2;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.noblur .tile{background:#15122a;-webkit-backdrop-filter:none;backdrop-filter:none}
.tile.full{grid-column:span 4}.tile h3{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between}.tile h3 output{color:var(--cyan);font-variant-numeric:tabular-nums}
@media(max-width:520px){.tile{grid-column:span 4}}
.seg{display:flex;padding:3px;border-radius:13px;background:var(--glass2)}.seg button{flex:1;min-height:46px;border:0;background:none;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer;padding:0 4px}.seg button.on{background:var(--grad);color:var(--on-grad)}
/* Màn đen, báo tử, bài học */
#black{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;overflow:auto;z-index:20}
#black .big{font:300 clamp(36px,10vw,72px)/1.05 var(--display);color:#fff}
#black .when{font-size:16px;color:var(--mute)}#black .cause{font:400 clamp(28px,7vw,42px)/1.2 var(--display);color:var(--rose);text-shadow:0 0 34px rgba(255,127,169,.5)}
#black .next{font:italic 300 18px/1.4 var(--display);color:var(--cyan)}
#sheet{left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:12px;z-index:15;border-radius:24px;padding:18px}
#sheet h2{font:400 26px/1.2 var(--display);margin:0}#sheet ul{margin:0;padding-left:20px}#sheet li{margin:4px 0}
.good{color:var(--ok)}.bad{color:var(--rose)}.card-p{font:400 19px/1.45 var(--display);margin:0}
.q{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fade{animation:f 1.1s ease both}@keyframes f{from{opacity:0}to{opacity:1}}

function transItems(){const x=PF.xe;return [
{x:9.6,z:12.6,y:1.4,verb:'Lên xe',hint:'Lên xe máy',on:()=>!P.veh&&!P.ride&&PROPS.myMoto&&PROPS.myMoto.parent&&!G.f.home,use(){

{x:16,z:9.6,y:1.6,verb:'Lên xe',hint:'Lên xe ô tô',on:()=>!P.veh&&PROPS.myCar&&PROPS.myCar.parent&&!G.f.home,use(){
talk('','Ngồi vào ghế lái.',[{t:'Thắt dây an toàn',f(){G.f.belt=1;logx('Thắt dây an toàn','good');mount(PROPS.myCar,'car')}},{t:'Khỏi, chạy gần',f(){G.f.belt=0;logx('Không thắt dây an toàn','risk');mount(PROPS.myCar,'car')}}])}},
{pos:()=>P.veh?[P.veh.m.position.x,P.veh.m.position.z]:[0,0],y:2,verb:'Xuống xe',hint:'Dừng xe, xuống',on:()=>P.veh&&Math.abs(P.veh.s)<1.2,use(){dismount()}},

{pos:()=>P.ride&&P.ride.m?[P.ride.m.position.x,P.ride.m.position.z]:[0,0],y:2,verb:'Lên xe',hint:'Lên xe',on:()=>P.ride&&P.ride.stage==='wait'&&!P.ride.on,use(){boardRide()}},
{x:22,z:10.2,y:1.6,verb:'Chờ xe',hint:'Đứng chờ xe buýt',on:()=>x==='bus'&&LIGHT.on&&!G.f.busCalled,use(){G.f.busCalled=1;say('','Xe buýt sắp tới.');later(4,()=>callRide('bus'))}}]}

if(x==='dibo')return [...(city?[{t:'Đi tới vạch kẻ, chờ đèn người đi bộ xanh rồi qua đường',at:[32,-2],done:()=>P.z<-.05&&P.x>CW[0]-3&&P.x<CW[1]+3||near(d,3)}]:[]),{t:'Đi bộ tới '+nm,at:d,done:()=>near(d,3)||G.f.arrived,on(){G.f.arrived=1;setTime(job()==='taixe'?'05:00':'07:40')}}];
if(x==='xemay')return [{t:'Lấy nón bảo hiểm ở kệ',at:[13.4,16.3],done:()=>G.inv.helmet},{t:'Ra hẻm, lên xe máy',at:[9.6,12.6],done:()=>!!P.veh||G.f.arrived},{t:'Chạy xe tới '+nm+(city?' · dừng khi đèn đỏ':''),at:d,done:()=>G.f.arrived}];
if(x==='oto')return [{t:'Ra xe ô tô đậu ngoài đường',at:[16,9.6],done:()=>!!P.veh||G.f.arrived},{t:'Lái xe tới '+nm,at:d,done:()=>G.f.arrived}];
if(x==='grabbike'||x==='grabcar')return [{t:'Bấm Điện thoại đặt '+TRANS[x],done:()=>G.f.booked},{t:'Ra đầu hẻm chờ xe',at:[10.5,10],done:()=>P.ride&&P.ride.stage!=='come'||G.f.arrived},{t:'Lên xe',at:()=>P.ride&&P.ride.m?[P.ride.m.position.x,9.8]:null,done:()=>P.ride&&P.ride.on||G.f.arrived},{t:'Ngồi xe tới '+nm,done:()=>G.f.arrived}];
if(x==='bus'&&city)return [{t:'Ra trạm xe buýt đầu phố',at:[22,10.2],done:()=>near([22,10.2],2.6)||G.f.busCalled},{t:'Đứng chờ xe buýt ở trạm',at:[22,10.2],done:()=>G.f.busCalled},{t:'Lên xe buýt',at:()=>P.ride&&P.ride.m?[P.ride.m.position.x,9.8]:null,done:()=>P.ride&&P.ride.on||G.f.arrived},{t:'Ngồi xe tới trạm gần '+nm,done:()=>G.f.arrived},{t:'Qua đường ở vạch kẻ khi đèn đi bộ xanh',at:[32,-2],done:()=>P.z<-.05||near(d,3.5)},{t:'Đi bộ tới '+nm,at:d,done:()=>near(d,3.5)}];
if(x==='bus')return [{t:'Ra đầu hẻm chờ xe đưa đón',at:[10.5,10],done:()=>near([10.5,10],2.5)||G.f.busCalled,on(){if(!G.f.busCalled){G.f.busCalled=1;later(3,()=>callRide('shuttle'))}}},{t:'Lên xe đưa đón',at:()=>P.ride&&P.ride.m?[P.ride.m.position.x,9.8]:null,done:()=>P.ride&&P.ride.on||G.f.arrived},{t:'Ngồi xe tới '+nm,done:()=>G.f.arrived}];
if(x==='metro')return [{t:'Đi bộ ra ga metro đầu phố',at:[-13.5,12.5],done:()=>near([-13.5,12.5],2.6)||G.f.arrived},{t:'Quẹt vé lên tàu',at:[-13.5,12.5],done:()=>G.f.arrived},{t:'Ra khỏi ga, đi tới '+nm,at:d,done:()=>near(d,3.5)}];
return []}
const VSPEC={moto:{max:11,acc:7,hl:.9},car:{max:12,acc:6,hl:1.95},truck:{max:9,acc:4,hl:3.3}};
function mount(m,type){P.veh={type,m,s:0,hl:VSPEC[type].hl};P.yaw=m.rotation.y+Math.PI/2;P.goto=null;if(type!=='moto')P.mesh.visible=false;toast(TOUCH?'▲ ga · ▼ phanh · ◀ ▶ lái':'W ga · S phanh · A D lái',3500)}
function dismount(){const v=P.veh;if(!v)return;const a=v.m.rotation.y,sx=Math.sin(a+Math.PI/2),sz=Math.cos(a+Math.PI/2);
let px=v.m.position.x-sz*1.4,pz=v.m.position.z+sx*1.4;if(hit(px,0,pz)){px=v.m.position.x+sz*1.4;pz=v.m.position.z-sx*1.4}P.x=px;P.z=pz;P.y=0;P.veh=null;P.mesh.visible=true;
if(!G.f.arrived&&near(dest(),9)){G.f.arrived=1;setTime(job()==='taixe'?'05:00':'07:40')}}
function protectedNow(){if(P.veh)return P.veh.type==='moto'?G.f.helmet==='strap':!!G.f.belt;if(P.ride)return P.ride.kind==='grabbike'?G.f.helmet==='strap':P.ride.kind==='grabcar'?!!G.f.belt:true;return false}
function crash(msg){if(G.mode!=='day')return;snd('horn');shake(.7);buzz(60);if(msg)toast(msg,2500);
if(protectedNow()&&Math.random()<RISK.protect){logx(P.veh&&P.veh.type==='moto'||P.ride&&P.ride.kind==='grabbike'?'Va chạm, nón cài quai giữ được':'Va chạm, dây an toàn giữ được','good');saved('crash')}else die(P.veh&&G.fat>85?'sleep':'car')}
// Xe do người khác lái: GrabBike, GrabCar, xe buýt, xe đưa đón, thuyền.
function callRide(kind){const city=LIGHT.on;let m,path,stopAt,hl;
if(kind==='grabbike'){m=moto(0x2e9d5f,0x2e9d5f,0x2e9d5f);hl=.9}else if(kind==='grabcar'){m=car(0x2e9d5f);hl=1.95}else if(kind==='boat'){m=PROPS.boat;hl=2.3}else{m=bus();hl=4}
if(kind==='boat'){P.ride={kind,m,hl,s:0,path:[[50,-16],[54,-30],[56,-44]],i:0,stage:'wait',on:false,max:4};return}
world.add(m);m.traverse(q=>{if(q.isMesh)q.castShadow=true});
const d=dest();
if(kind==='bus'){m.position.set(-22,0,6.5);path=[[16,6.5],[22,8.2]];stopAt=[[28,6.5],[40,6.5],[44,8.2]]}
else{m.position.set(-18,0,6.5);path=[[6,6.5],[10.5,8.2]];stopAt=[[16,6.5],[d[0]+12,6.5],[d[0]+15,4.5],[d[0]+12,2.5],[d[0]+3,2.5],[d[0],.9]]}
P.ride={kind,m,hl,s:0,path,i:0,stage:'come',on:false,next:stopAt,max:kind==='bus'||kind==='shuttle'?6:8};toast(kind==='bus'||kind==='shuttle'?'Xe đang tới.':'Tài xế đang tới, 1 phút.',2500)}
function boardRide(){const R=P.ride;if(!R)return;
const go=()=>{R.on=true;R.stage='go';if(R.kind!=='boat'){R.path=R.next;R.i=0}else{R.i=0}if(R.kind!=='grabbike'&&R.kind!=='boat')P.mesh.visible=false;P.goto=null;
if(R.kind==='grabbike'||R.kind==='grabcar')R.event=Math.random()<.6};
if(R.kind==='grabbike')talk('Tài xế','Nón nè anh chị, đội vô nha.',[{t:'Đội nón, cài quai',f(){G.f.helmet='strap';logx('Đội nón tài xế đưa, cài quai','good');go()}},{t:'Đội hờ cho mát',f(){G.f.helmet='loose';logx('Đội nón không cài quai','risk');go()}}]);
else if(R.kind==='grabcar')talk('','Ngồi ghế sau.',[{t:'Thắt dây an toàn',f(){G.f.belt=1;logx('Thắt dây an toàn ghế sau','good');go()}},{t:'Khỏi, ghế sau mà',f(){G.f.belt=0;logx('Không thắt dây an toàn','risk');go()}}]);
else if(R.kind==='boat')go();
else{if(G.inv.wallet){G.money-=7}logx(R.kind==='bus'?'Đi xe buýt':'Đi xe đưa đón công nhân','good');go()}}
function rideStep(dt){const R=P.ride;if(!R||!R.m)return;const m=R.m;
if(R.stage==='wait'||R.stage==='fish'){if(R.on){P.x=m.position.x;P.z=m.position.z}if(R.kind==='boat'&&G.storm)m.rotation.z=Math.sin(performance.now()*.004)*.18;return}
const tg=R.path[R.i];if(!tg){if(R.stage==='come'){R.stage='wait';snd('ding');toast(R.kind==='bus'?'Xe buýt tới rồi. Lên xe.':'Xe tới rồi. Lên xe.',2500)}else arriveRide();return}
const dx=tg[0]-m.position.x,dz=tg[1]-m.position.z,d=Math.hypot(dx,dz);
let tgt=R.max*(R.rush?1.5:1);if(LIGHT.on&&LIGHT.car!=='g'&&Math.abs(m.position.z-4)<4.5){if(dx>0&&m.position.x+R.hl<CW[0]-.4&&m.position.x+R.hl>CW[0]-7)tgt=Math.max(0,(CW[0]-.5-m.position.x-R.hl)*1.4);if(dx<0&&m.position.x-R.hl>CW[1]+1.4&&m.position.x-R.hl<CW[1]+8)tgt=Math.max(0,(m.position.x-R.hl-CW[1]-1.5)*1.4)}
if(d<2.5)tgt=Math.min(tgt,d*1.8+.5);R.s+=(tgt-R.s)*Math.min(1,dt*2.5);
if(d<.4){R.i++;return}const st=Math.min(d,R.s*dt);m.position.x+=dx/d*st;m.position.z+=dz/d*st;m.rotation.y=Math.atan2(-dz,dx);
if(R.kind==='boat'&&G.storm)m.rotation.z=Math.sin(performance.now()*.004)*.18;
if(R.on){P.x=m.position.x;P.z=m.position.z;P.yaw=m.rotation.y+Math.PI/2;
if(R.event&&R.i>=2&&!R.evDone){R.evDone=1;rideEvent(R)}}}
function rideEvent(R){
if(R.kind==='grabbike'){R.rush=true;talk('Tài xế','Trễ đơn rồi, chạy nhanh chút nha!',[{t:'"Anh chạy chậm lại giùm."',f(){R.rush=false;logx('Nhắc tài xế chạy chậm','good');say('Tài xế','Ừ, chạy từ từ.')}},{t:'"Ừ, nhanh lên."',f(){logx('Để tài xế chạy ẩu','risk');if(Math.random()<RISK.grabRush)later(1.5,()=>crash('Xe lạng lách, va vào xe khác!'))}}])}
else{talk('','Tài xế vừa lái vừa bấm điện thoại.',[{t:'"Anh tập trung lái giùm."',f(){logx('Nhắc tài xế tập trung','good');say('Tài xế','Xin lỗi, xin lỗi.')}},{t:'Kệ',f(){logx('Kệ tài xế dùng điện thoại','risk');if(Math.random()<RISK.grabPhone)later(2,()=>crash('Xe tông vào đuôi xe phía trước!'))}}])}}
function arriveRide(){const R=P.ride;if(R.kind==='boat'){if(R.home){P.ride=null;P.x=44.5;P.z=-10;P.y=1;G.f.back=1;G.storm=false;RAIN.visible=false;setTime('15:30');toast('Về tới bến.',2000);return}R.stage='fish';return}
const ax=R.m.position.x,az=R.m.position.z;P.x=ax;P.z=az<4?-1.8:9.8;P.y=0;P.mesh.visible=true;G.f.arrived=1;setTime(job()==='thomo'?'06:30':'07:40');

function questStep(){const Q=G.Q;let n=0,adv=false;while(G.qi<Q.length&&Q[G.qi].done()&&n++<6){if(Q[G.qi].on)Q[G.qi].on();G.qi++;adv=true}

const h=`<div class="now">${sq?ico(sq.i,24)+`<span>${esc(sq.t)}</span>`+(!TOUCH&&sq.key?`<span class="kbd">${sq.key}</span>`:'')+'<i id="qa"><svg viewBox="0 0 24 24"><path d="M12 2l8 18-8-5-8 5z"/></svg></i><span id="qd"></span>':''}</div><div class="more">${more}</div>`;
if(box.dataset.h!==h){box.innerHTML=h;box.dataset.h=h}
renderVit();
document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));if(cur&&sq){const k=sq.i;const js=CFG.ctrl==='joy';const el=k==='up'&&G.qi<3&&G.tut&&G.tut.fwd<=1.5?(js?$('#joyb'):$('#pad [data-k=f]')):k==='side'?(js?$('#joyb'):$('#pad [data-k=r]')):k==='jump'?$('#tj'):/Điện thoại/.test(cur.t)?$('#tq'):null;if(el)el.classList.add('hint')}
$('#tq').classList.toggle('ring',!!(G.f.momMsg&&!G.f.called2));
if(!cur)return null;return typeof cur.at==='function'?cur.at():cur.at||null}

<script>
// Biến cố riêng của nghề giao hàng: app báo đơn khi đang chạy, xe tải lấn làn.

if(G.oi===2&&G.ost===1&&!G.f.blind){const tr=VEH.find(q=>q.t==='t');if(!tr)return;
if(!G.blindT){if(Math.abs(v.s)>4&&v.m.position.x>30&&v.m.position.x<75&&v.m.position.z>4&&v.m.position.z<8.6&&Math.sin(P.yaw)>.5){G.blindT=1.9;tr.d=1;tr.m.rotation.y=0;tr.m.position.x=v.m.position.x-1.5;tr.z=Math.max(4.6,v.m.position.z-1.8);tr.m.position.z=tr.z;tr.s=Math.abs(v.s);snd('horn');toast('Xe tải lấn sang làn bạn! Phanh lại!',2500)}}
else{G.blindT-=dt;tr.m.position.z+=dt*.7;tr.z=tr.m.position.z;if(Math.abs(v.s)<3){G.f.blind=1;G.blindT=0;logx('Phanh kịp khi xe tải lấn làn','good');say('','Hú hồn!')}else if(G.blindT<=0){G.f.blind=1;G.blindT=0;logx('Chạy trong điểm mù xe tải','risk');crash('Xe tải ép vào!')}}}};

// ===== Lời nói, hội thoại =====
function say(who,text){talk(who,text)}

d.innerHTML='<div class="row" id="dopts"></div>';const w=$('#dopts');
opts.forEach((o,i)=>{const bt=document.createElement('button');bt.className='btn';bt.type='button';bt.textContent=(TOUCH?'':(i+1)+'. ')+T(o.t);bt.onclick=()=>{closeTalk();cv.focus();snd('tick');buzz(8);if(o.f)o.f()};w.appendChild(bt)})}

if(job()==='thodien'&&G.f.ppe&&G.f.called===undefined)opts.push({t:'Gọi điều độ, chờ xác nhận đã cắt điện',f(){act('call',2.5,()=>{G.f.called=1;G.f.cut=1;G.min+=15;logx('Gọi điều độ cắt điện trước khi làm','good');say('Điều độ','Đã cắt điện tuyến 3. Làm đi anh.')})}},{t:'Thôi, làm luôn cho nhanh',f(){G.f.called=0;G.f.cut=0;logx('Không xin cắt điện','risk')}});
if((PF.xe==='grabbike'||PF.xe==='grabcar')&&!G.f.booked&&!G.f.arrived&&DOORS.front.open)opts.push({t:'Đặt '+TRANS[PF.xe],f(){G.f.booked=1;later(5,()=>callRide(PF.xe))}});
if(G.f.momMsg&&!G.f.called2){const who=G.f.momMsg;opts.push({t:'Gọi lại cho '+who,f(){act('call',3,()=>{G.f.called2=1;logx('Gọi lại cho '+who,'good');talk(who,'Ừ, nhớ giữ sức khỏe nghe con.')})}})}
if(!opts.length){talk('Điện thoại','Không có gì mới.');return}
talk('Điện thoại',G.f.momMsg&&!G.f.called2?`${G.f.momMsg} nhắn: "Cuối tuần về ăn cơm không con?"`:'Chọn việc:',opts.concat([{t:'Đóng',f:null}]))}

P.x=2.5;P.y=0;P.z=20.5;P.yaw=Math.PI;P.pitch=-.2;P.busy=null;P.goto=null;P.veh=null;P.ride=null;buildPlayer(false);
if(job()==='sinhvien'){later(2,()=>toast('Tối qua bạn thức tới 3 giờ sáng chạy deadline.',4000))}
addHaz();G.Q=quests();renderInv();hud(true);
const other=['Mẹ','Bố'].find(q=>!famBy(q))||'Khoa (bạn thân)';later(80,()=>{if(G.mode!=='day')return;G.f.momMsg=other;snd('ding')});
G.sudden=Math.random()<RISK.sudden+(PF.hl.tim?.06:0)?8+Math.floor(Math.random()*(G.Q.length-10)):-1;G.fate=Object.keys(book().deaths).length===0?{k:FATE[job()][0],fit:FATE[job()][1],at:Math.floor(G.Q.length*.55)}:null;if(G.fate)G.sudden=-1;G.scnKill=null;scnClear();scnPlan();

bồn trộn bê tông.","s":"Phanh lùi lại hẳn.","r":"Tăng ga cố chạy song song hoặc vượt lên góc phải xe bồn.","o":"Xe bồn cua gấp, may mà bạn đã lùi lại.","q":"Người ta nói tài xế xe lớn không nhìn thấy nó...","l":"Vùng hông phải sau cabin và sát đầu xe là 'điểm mù chết chóc' của xe tải, xe bồn. Nếu bạn không thấy mặt tài xế trong gương của họ, họ hoàn toàn không thấy bạn.","k":"car"},{"id":"gh_02","n":"Nắng đổ lửa","c":{"job":"giao_hang","time_slot":"lunch","season":"summer","location":["Hà Nội","Đà Nẵng","TP.HCM"]},"w":"Thanh trạng thái 'Nhiệt' góc màn hình đỏ rực.","s":"Nghỉ dưới bóng cây, uống nước.","r":"Chạy cố liên tục giữa 12h trưa.","o":"Thanh Nhiệt tụt xuống.","q":"Vì tiếc mấy chục ngàn tiền ship mà anh ấy không dám nghỉ ngơi...","l":"Sốc nhiệt có thể gây tử vong. Làm việc ngoài trời nắng gắt phải che chắn kín, uống nước thường xuyên.","k":"heat"},{"id":"gh_03","n":"Đơn hỏa tốc giờ cao điểm","c":{"job":"giao_hang","time_slot":"work_2","habit":"voi_vang"},"w":"Đơn hàng trên màn hình nhấp nháy đỏ báo sắp trễ giờ.","s":"Xếp hàng sau dòng xe, chấp nhận giao trễ.","r":"Phóng lên vỉa hè để tiết kiệm vài phút.","o":"Khách hàng thông cảm khi nhận hàng.","q":"Người ta gọi báo tai nạn, bảo nó leo lề tông vào rào chắn...","l":"Áp lực thời gian của thuật toán giao hàng thường đẩy tài xế vào hành vi lái xe nguy hiểm. Đừng đánh cược tính mạng chỉ vì sợ bị trừ tiền hay đánh giá 1 sao.","k":"car"},{"id":"tm_01","n":"Tiếng rít của máy đo","c":{"job":"tho_mo","time_slot":"work_1"},"w":"Đang đào than dưới hầm sâu.","s":"Chạy ngay ra khu vực hầm chính có thông gió.","r":"Tắt tiếng máy đo, tiếp tục cuốc vào vỉa than.","o":"Kịp thoát ra trước khi một túi khí rò rỉ làm ngạt thở khu vực hẹp.","q":"Anh ấy đã có nhiều năm kinh nghiệm, sao lại bỏ qua báo động của máy đo khí...","l":"Cháy nổ khí Metan là rủi ro thảm khốc nhất ngành khai khoáng. Khí này không màu, không mùi, chỉ có thể phát hiện bằng thiết bị đo. Tuyệt đối không phớt lờ cảnh báo.","k":"mine"},{"id":"tm_02","n":"Cột chống rạn nứt","c":{"job":"tho_mo","time_slot":"work_2","health":"all"},"w":"Nghe thấy tiếng 'rắc rắc' khô khốc phía trên đầu.","s":"Dùng bộ đàm báo động, lùi lại khỏi khu vực rạn nứt.","r":"Bước thẳng vào vùng nguy hiểm để làm nốt việc.","o":"Đội kỹ thuật xuống gia cố lại trần kịp thời.","q":"Đất đá sập xuống nhanh quá, không ai kịp kéo cậu ấy ra...","l":"Bất kỳ sự rạn nứt nào của vì chống cũng là dấu hiệu nguy hiểm khẩn cấp. Báo ngay và rời khỏi khu vực.","k":"collapse"},{"id":"tm_03","n":"Tiếng kêu trong đường lò","c":{"job":"tho_mo","time_slot":"work_1"},"w":"Đi ngang qua một ngách hầm phụ bị sạt nhẹ, bạn nghe tiếng rên rỉ của một đồng nghiệp mới vào…","s":"Bấm E cố gắng nâng đá cứu người.","r":"Không có lựa chọn rủi ro dẫn đến chết ở đây, chỉ có cứu người hay không.","o":"Bạn cứu được người đồng nghiệp trẻ.","q":"Không áp dụng cho kết cục này.","l":"Quy định an toàn lao động yêu cầu thợ mỏ luôn đi theo nhóm. Sự tương trợ dưới hầm sâu là cứu cánh cho mọi rủi ro không lường trước.","k":""},{"id":"xt_01","n":"Quốc lộ nửa đêm","c":{"job":"xe_tai","time_slot":"evening","health":"thieu_ngu"},"w":"Trời tối đen, tiếng động cơ chạy đều đều.","s":"Tấp vào trạm dừng nghỉ, ngủ 30 phút.","r":"Uống nước tăng lực, ráng căng mắt lái tiếp.","o":"Nhân vật ngủ một giấc ngắn, tỉnh táo chạy tiếp và giao hàng an toàn.","q":"Vì muốn về kịp sinh nhật con sáng mai, anh ấy đã không chịu dừng lại ngủ...","l":"Nước tăng lực không thể chống lại 'giấc ngủ trắng' (Microsleep). Khi não bộ bị ép thức quá giới hạn, nó sẽ tự động ngắt ý thức vài giây mà cơ thể vẫn mở mắt.","k":"sleep"},{"id":"xt_02","n":"Mùi khét đổ đèo","c":{"job":"xe_tai","time_slot":"work_1","location":["Lào Cai","Đà Lạt","Các tỉnh miền núi"]},"w":"Đang đổ dốc đèo dài 10km.","s":"Về số thấp, nhả phanh chân.","r":"Tiếp tục rà phanh chân liên tục khi xe lao dốc.","o":"Xe rầm rì trôi xuống dốc chậm rãi nhờ lực cản động cơ.","q":"Họ nói hệ thống phanh đã cháy rụi trước khi xe rơi xuống...","l":"Rà phanh liên tục khi đổ đèo sẽ làm má phanh sôi trơ lì, mất hoàn toàn tác dụng. Quy tắc sống còn của tài xế xe tải: 'Lên số nào, xuống số đó'.","k":"car"},{"id":"xt_03","n":"Cảnh báo sớm","c":{"job":"xe_tai","time_slot":"commute","habit":"can_than"},"w":"Trời sương mù dày đặc.","s":"Đặt cọc tiêu phản quang để báo hiệu cho xe sau.","r":"Không có lựa chọn rủi ro cho nhân vật chính trong scenario cứu người này.","o":"Một xe khách lao tới kịp thời đạp phanh nhờ thấy cọc tiêu.","q":"Không áp dụng.","l":"Đặt cảnh báo từ xa khi có sự cố trên đường sương mù hoặc cao tốc giúp ngăn tai nạn liên hoàn.","k":""},{"id":"nd_01","n":"Hướng gió độc","c":{"job":"nong_dan","time_slot":"morning"},"w":"Mang bình xịt thuốc bảo vệ thực vật ra đồng.","s":"Bỏ thời gian đi vòng sang bờ bên kia, xịt theo chiều gió.","r":"Xịt thuốc ngược chiều gió với khuôn mặt không khẩu trang bảo hộ.","o":"Thuốc bay xa, hoàn thành công việc không bị dính thuốc.","q":"Ông ấy xịt thuốc bao nhiêu năm nay, ai ngờ lần này thuốc mạnh quá...","l":"Ngộ độc thuốc bảo vệ thực vật cấp tính qua đường hô hấp hoặc niêm mạc mắt rất phổ biến ở nông thôn. Luôn xịt xuôi chiều gió và đeo khẩu trang chuyên dụng.","k":"poison"},{"id":"nd_02","n":"Sợi dây kẽm phát sáng","c":{"job":"nong_dan","time_slot":"evening"},"w":"Trời nhá nhem tối, đi thăm ruộng lúa.","s":"Đi đường vòng an toàn.","r":"Cố nhảy qua bờ ruộng có chăng dây điện.","o":"Về nhà an toàn ăn cơm tối.","q":"Chỉ là đi thăm nước cho lúa, mà người ta ác quá giăng điện ngoài đồng...","l":"Sử dụng điện lưới để bẫy chuột là hành vi trái pháp luật, cực kỳ nguy hiểm. Ở nhiều địa phương như An Giang, Đồng Tháp đã có nhiều án mạng thương tâm từ loại bẫy này.","k":"trap"},{"id":"nd_03","n":"Trời gầm sấm chớp","c":{"job":"nong_dan","time_slot":"work_2","season":"rainy"},"w":"Đang cuốc đất giữa đồng không mông quạnh.","s":"Chạy vào chòi canh lúa.","r":"Núp dưới gốc cây to giữa đồng.","o":"Mưa trút xuống.","q":"Thấy trời chuyển dông là bà ấy chạy tìm chỗ trú, không ngờ lại đứng ngay gốc cây...","l":"Sét thường đánh vào điểm cao nhất trong một khu vực mở. Đứng dưới cây độc lập giữa cánh đồng khi có giông sét là vị trí tử thần.","k":"lightning"},{"id":"ng_01","n":"Áo phao vướng víu","c":{"job":"ngu_dan","time_slot":"work_1"},"w":"Đang ở trên boong tàu đánh cá.","s":"Tạm dừng công việc, mặc áo phao phản quang.","r":"Lười mặc áo phao vì vướng víu, cố gắng kéo nốt mẻ lưới.","o":"Sóng lớn đánh văng xuống biển, nhưng áo phao giữ bạn nổi lên mặt nước chờ người cứu.","q":"Em ấy bơi rất giỏi, nhưng sóng lớn quá người ta không tìm thấy...","l":"Đuối nước cướp đi sinh mạng hàng ngàn người mỗi năm . Ở biển khơi, kỹ năng bơi lội là vô nghĩa trước sóng dữ, áo phao là cơ hội sống sót duy nhất.","k":"drown"},{"id":"ng_02","n":"Bến đỗ bình yên","c":{"job":"ngu_dan","time_slot":"evening"},"w":"Chuyến biển kết thúc.","s":"Đi về phía gia đình.","r":"N/A","o":"Một chuyến biển thành công.","q":"Hôm nay biển êm, anh ấy lại mang cá đầy khoang về cho mẹ con tôi.","l":"Phía sau mỗi chuyến đi làm xa vất vả, sự trở về bình an của bạn là món quà vô giá nhất đối với gia đình.","k":""},{"id":"ng_03","n":"Dây neo căng cứng","c":{"job":"ngu_dan","time_slot":"work_2"},"w":"Máy tời đang thu mẻ lưới nặng.","s":"Đứng xa vị trí dây cáp đang chịu tải nặng.","r":"Đứng sát dây tời đang bị quá tải để làm cho nhanh.","o":"Dây cáp đứt phựt nhưng văng sượt qua không trúng người.","q":"Người ta nói dây tời trên tàu đã cũ mà anh ấy không chịu thay...","l":"Dây cáp đứt do quá tải sẽ văng với lực cực mạnh. Luôn đứng ngoài bán kính văng của dây tời, dây neo khi thiết bị đang hoạt động chịu tải.","k":"struck"},{"id":"sv_01","n":"Đêm dài thi cử","c":{"job":"sinh_vien","time_slot":"evening","health":"thieu_ngu"},"w":"Đồng hồ chỉ 2 giờ sáng.","s":"Gấp máy tính, lên giường ngủ bù.","r":"Nốc thêm nước tăng lực, ráng thức trắng đêm thứ ba liên tiếp.","o":"Sáng hôm sau đi thi dù không thuộc hết bài nhưng đầu óc tỉnh táo.","q":"Nó nói dạo này đang mùa thi nên phải thức khuya nhiều lắm...","l":"Lạm dụng nước tăng lực khi cơ thể kiệt sức vì thiếu ngủ kéo dài có thể gây rối loạn nhịp tim và đột quỵ ở người trẻ tuổi. Giấc ngủ là không thể thay thế.","k":"cardiac"},{"id":"sv_02","n":"Cỗ máy rò rỉ","c":{"job":"sinh_vien","time_slot":"work_1"},"w":"Đang làm thêm tại quán cà phê.","s":"Ngắt cầu dao điện tổng của quán.","r":"Lau dọn vũng nước quanh thiết bị đang có dấu hiệu rò điện.","o":"Máy tắt an toàn, chờ thợ tới sửa.","q":"Làm thêm vất vả mấy đồng mà chủ quán không bảo trì máy móc...","l":"Thiết bị điện công suất lớn bị rò rỉ nước là nguyên nhân gây giật điện thường gặp. Luôn ngắt nguồn điện tổng trước khi dọn dẹp hoặc kiểm tra thiết bị.","k":"electric"},{"id":"sv_03","n":"Góc khuất vỉa hè","c":{"job":"sinh_vien","time_slot":"commute","vehicle":"xe_may"},"w":"Chạy xe máy về nhà trọ lúc nửa đêm.","s":"Giảm tốc độ, quan sát kỹ trước khi qua.","r":"Phóng nhanh qua ngã tư khuất tầm nhìn.","o":"Một chiếc xe ba gác chở đá lao nhanh từ hẻm ra, may mà bạn phanh kịp.","q":"Chỉ còn một đoạn nữa là về tới xóm trọ rồi...","l":"Lái xe qua các ngã tư, ngõ hẻm khuất tầm nhìn vào ban đêm luôn tiềm ẩn rủi ro do xe khác chạy ẩu. Giảm tốc độ là cách bảo vệ bản thân tốt nhất.","k":"car"},{"id":"br_01","n":"Trưa hè đổ lửa","c":{"job":"ban_rong","time_slot":"lunch","season":"summer"},"w":"Trời trưa nắng gắt.","s":"Nghỉ ngơi dưới bóng cây, bổ sung nước.","r":"Cố gắng đẩy xe nặng leo dốc giữa trời nắng gắt.","o":"Cơ thể hạ nhiệt, tỉnh táo trở lại để làm việc tiếp.","q":"Thấy trời nắng quá, tôi đã khuyên ở nhà một bữa mà không nghe...","l":"Say nắng (sốc nhiệt) khi lao động liên tục dưới trời nắng gắt có thể dẫn đến hôn mê sâu. Cần tìm bóng râm nghỉ ngơi ngay khi thấy hoa mắt, chóng mặt.","k":"heat"},{"id":"br_02","n":"Khách vẫy bên đường","c":{"job":"ban_rong","time_slot":"work_1"},"w":"Đang đứng ở lề đường bên này.","s":"Kiên nhẫn đi vòng qua vạch kẻ đường, chờ đèn đỏ.","r":"Lách chạy cắt ngang dòng xe đang di chuyển tốc độ cao.","o":"Mất khách , nhưng an toàn tính mạng.","q":"Chỉ vì cố bán thêm món hàng mà đánh đổi cả mạng sống...","l":"Băng ngang đường bất chấp dòng xe cộ chạy nhanh là hành vi đánh cược mạng sống. Quan sát và đi đúng phần đường dành cho người đi bộ là quy tắc sinh tồn.","k":"car"},{"id":"br_03","n":"Chiếc xe tuột dốc","c":{"job":"ban_rong","time_slot":"work_2"},"w":"Một chiếc xe bán trái cây tự chế đậu trên dốc bị tuột đồ kê bánh, đang lùi tự do rất nhanh về…","s":"Chạy tới chèn gạch cứu người.","r":"Không có lựa chọn gây tử vong cho người chơi ở cảnh này.","o":"Chiếc xe khựng lại vừa kịp lúc.","q":"Không áp dụng cho kết cục này.","l":"Sự tinh ý và phản xạ nhanh nhẹn trên đường phố của bạn không chỉ bảo vệ bản thân mà đôi khi còn cứu được sinh mạng của những người xung quanh.","k":""},{"id":"cmn_11","n":"Góc chợ trơn trượt","c":{"job":"all","time_slot":"morning","habit":"voi_vang"},"w":"Đi mua đồ ăn sáng tại khu chợ truyền thống.","s":"Đi bộ chậm rãi, tránh vũng nước.","r":"Chạy vội vã qua nền gạch ướt sũng rêu.","o":"Mua đồ xong xuôi, ra khỏi chợ an toàn.","q":"Sáng nay mới bảo đi ù ra chợ mua mớ rau rồi về ăn cơm mà...","l":"Trượt ngã tại các bề mặt trơn ướt dễ gây chấn thương sọ não nghiêm trọng. Cần đi chậm và mang giày dép có độ bám tốt ở những nơi điều kiện mặt sàn kém.","k":"fall"},{"id":"cmn_12","n":"Cảnh báo từ bác sĩ","c":{"job":"all","time_slot":"morning","health":"huyet_ap"},"w":"Nhân vật đang ở trạm y tế.","s":"Về nhà nằm nghỉ ngơi trên giường.","r":"Phớt lờ lời bác sĩ, lái xe đến chỗ làm.","o":"Cơn đau đầu thuyên giảm sau một giấc ngủ dài.","q":"Bác sĩ đã dặn là phải nghỉ ngơi tuyệt đối, thế mà vẫn cố đi làm...","l":"Bỏ qua lời khuyên nghỉ ngơi của chuyên gia y tế khi có dấu hiệu bệnh nền là nguyên nhân dẫn đến các cơn đột quỵ không thể vãn hồi.","k":"stroke"},{"id":"cmn_13","n":"Quai nón lỏng lẻo","c":{"job":"all","time_slot":"commute","vehicle":"xe_may","habit":"luoi_bao_ho"},"w":"Đội mũ bảo hiểm lên đầu, biểu tượng khóa quai nhấp nháy trên màn hình kèm tiếng dây đai va đập…","s":"Bấm E cài quai nón.","r":"Để quai nón lỏng lẻo, điều khiển xe chạy thẳng.","o":"Nếu xảy ra va chạm nhẹ phía sau, mũ không văng, sống sót.","q":"Luôn nhắc nhở là phải cài quai nón cho cẩn thận rồi mà...","l":"Đội mũ bảo hiểm không cài quai đúng quy cách thì khi va chạm, mũ sẽ văng ra khỏi đầu, mất hoàn toàn tác dụng bảo vệ.","k":""},{"id":"cmn_16","n":"Bếp gas rò rỉ","c":{"job":"all","time_slot":"morning"},"w":"Bước vào bếp.","s":"Mở toang cửa sổ, sau đó khóa van bình gas.","r":"Bật công tắc đèn tường.","o":"Khí gas tản ra ngoài, bạn khóa van an toàn và thở phào nhẹ nhõm.","q":"Sáng ra ngửi mùi gas mà tôi quên dặn mở cửa ra trước...","l":"Khi phát hiện rò rỉ khí gas, tuyệt đối không bật/tắt bất kỳ công tắc điện nào, kể cả điện thoại. Hãy mở toang cửa sổ và khóa ngay van bình gas.","k":"fire"},{"id":"cmn_17","n":"Hóc nghẹn im lặng","c":{"job":"all","time_slot":"lunch"},"w":"Ăn vội vàng.","s":"Chạy ra chỗ đông người, ra hiệu cầu cứu.","r":"Chạy vào phòng vệ sinh kín, đóng cửa lại.","o":"Một người kịp thời dùng thủ thuật Heimlich ấn bụng cứu bạn.","q":"Cứ tưởng đi vệ sinh bình thường, ai ngờ lại bị hóc nghẹn một mình trong đó...","l":"Khi bị hóc dị vật gây tắc đường thở, bạn chỉ có vài phút vàng. Tuyệt đối không trốn vào không gian vắng, hãy ra hiệu cầu cứu ngay lập tức.","k":"choke"},{"id":"cmn_18","n":"Chó dữ thả rông","c":{"job":"all","time_slot":"commute","vehicle":"di_bo"},"w":"Đang đi bộ trên hẻm nhỏ.","s":"Lùi lại chậm rãi, mắt không nhìn chằm chằm vào nó.","r":"Quay lưng bỏ chạy thục mạng.","o":"Con chó sủa vài tiếng rồi quay đầu đi chỗ khác.","q":"Chỉ đi bộ ngoài ngõ thôi mà bị chó cắn vỡ cả bắp chân...","l":"Đột ngột bỏ chạy quay lưng sẽ kích thích bản năng rượt đuổi của chó dữ. Cách tốt nhất là đứng im hoặc lùi lại từ từ, tránh giao tiếp bằng mắt trực diện.","k":""},{"id":"cmn_19","n":"Cứu hỏa khu phố","c":{"job":"all","time_slot":"evening"},"w":"Nghe tiếng tri hô 'Cháy!'.","s":"Dùng bình chữa cháy xịt thẳng vào gốc lửa.","r":"Tạt nước vào đám cháy có chứa xăng dầu.","o":"Lửa tắt lịm, hàng xóm cảm ơn rối rít.","q":"Thấy nhà người ta cháy sang giúp nhiệt tình, mà không ngờ xài sai cách...","l":"Tuyệt đối không dùng nước để dập đám cháy từ xăng dầu hoặc thiết bị điện. Bình chữa cháy bột hoặc khí CO2 là lựa chọn an toàn duy nhất.","k":""},{"id":"vp_04","n":"Cây nước nóng lạnh","c":{"job":"van_phong","time_slot":"work_2"},"w":"Cây nước ở công ty rỉ một vũng nước nhỏ ra thảm.","s":"Báo bảo trì, không chạm vào cây nước.","r":"Tay trần chạm vào vòi nước kim loại đang có nước chảy.","o":"Lấy nước ở tầng khác.","q":"Cái cây nước đó đã báo hỏng rỉ nước từ tuần trước mà chưa ai sửa...","l":"Cây nước nóng lạnh tại công sở nếu không được nối đất an toàn và để rò rỉ nước sẽ biến thành bẫy điện giật chết người.","k":"electric"},{"id":"gh_04","n":"Hẻm vắng đêm khuya","c":{"job":"giao_hang","time_slot":"evening"},"w":"Giao đơn cuối ngày vào con hẻm cụt tối tăm.","s":"Bỏ lại tài sản, tháo chạy bảo toàn tính mạng.","r":"Giằng co, cố gắng đánh lại hai tên cướp có hung khí.","o":"Mất xe máy nhưng thoát thân an toàn đến đồn công an.","q":"Chiếc xe là cả cơ nghiệp, nên nó mới tiếc của không buông tay...","l":"Tính mạng luôn quý giá hơn mọi tài sản. Khi đối mặt với cướp manh động có hung khí, ưu tiên hàng đầu là hợp tác và tìm cách chạy trốn.","k":""},{"id":"xd_04","n":"Móng giáo lún chìm","c":{"job":"xay_dung","time_slot":"morning","season":"rainy"},"w":"Sau cơn mưa lớn đêm qua, nền đất công trình nhão nhoét.","s":"Dùng ván đệm chêm chắc chắn chân giàn giáo.","r":"Bỏ qua lỗi móng, trèo lên giàn giáo làm việc.","o":"Giàn giáo chịu lực tốt, làm việc cả ngày an toàn.","q":"Nền đất yếu sau mưa mà không ai kiểm tra lại chân chống...","l":"Sập giàn giáo do nền móng yếu là lỗi cực kỳ phổ biến. Hệ thống giáo chống chỉ an toàn tuyệt đối khi cả 4 chân được tựa lên mặt phẳng cứng, không sụt lún.","k":"fall"},{"id":"nm_04","n":"Cửa thoát hiểm bị chặn","c":{"job":"nha_may","time_slot":"work_2"},"w":"Xưởng báo cháy, khói lan nhanh.","s":"Bỏ cửa chính, chạy hướng khác tìm lối thoát phụ thoáng đãng.","r":"Cố sức bốc dỡ hàng hóa cản trở ngay cửa chính trong lúc khói mù mịt.","o":"Thoát ra ngoài qua cửa hông, ho sặc sụa nhưng bảo toàn mạng sống.","q":"Lối thoát hiểm luôn bị nhà máy chất đầy hàng, đến lúc có chuyện chạy không kịp...","l":"Trong hỏa hoạn, thời gian ngạt khói chỉ tính bằng phút. Đừng lãng phí sức lực dọn dẹp vật cản, hãy dùng thời gian đó tìm con đường thoát thân khả thi hơn.","k":"fire"},{"id":"td_04","n":"Trụ điện rạn nứt","c":{"job":"tho_dien","time_slot":"work_1"},"w":"Được giao trèo lên cột điện bê tông cũ.","s":"Từ chối trèo, yêu cầu hỗ trợ bằng xe thang nâng chuyên dụng.","r":"Đeo guốc bám trực tiếp lên thân trụ rạn nứt.","o":"Xe thang tới hỗ trợ đưa lên cao an toàn.","q":"Cột điện đó đã nứt từ đợt bão năm ngoái mà vẫn bắt thợ trèo...","l":"Luôn kiểm tra kết cấu của trụ điện trước khi leo. Với những trụ bê tông nứt hoặc cột gỗ mục rỗng, bắt buộc phải dùng xe thang nâng để sửa chữa.","k":"fall"},{"id":"tm_04","n":"Mạch nước ngầm","c":{"job":"tho_mo","time_slot":"work_2"},"w":"Vách lò rỉ nước đục bẩn ngày càng nhanh.","s":"Sơ tán khẩn cấp lên các tầng hầm cao hơn.","r":"Tiếp tục đứng đó chặn dòng nước rỉ.","o":"Vừa chạy lên cao, túi nước ngầm vỡ tung cuốn trôi máy móc bên dưới.","q":"Đã có dấu hiệu bục nước hầm lò mà không ai ra lệnh sơ tán...","l":"Bục túi nước ngầm hầm lò là thảm họa không thể chống đỡ bằng sức người. Khi thấy nước rỉ đục và tiếng động lạ, chỉ có một lựa chọn là sơ tán.","k":"mine"},{"id":"xt_04","n":"Nổ lốp cao tốc","c":{"job":"xe_tai","time_slot":"commute"},"w":"Đang chạy cao tốc 80km/h.","s":"Giữ chặt vô lăng, để xe tự trôi giảm tốc từ từ.","r":"Đạp phanh gấp theo phản xạ giật mình.","o":"Xe trôi chậm lại rồi tấp lề an toàn bằng lốp xẹp.","q":"Chỉ vì hoảng hốt đạp phanh gấp khi nổ lốp mà xe bị lật...","l":"Khi nổ lốp ở tốc độ cao, đạp phanh gấp sẽ làm xe mất trọng tâm và lật ngay lập tức. Nguyên tắc sinh tồn là giữ thẳng lái và để xe tự hãm tốc.","k":"car"},{"id":"nd_04","n":"Lẩn khuất trong cỏ","c":{"job":"nong_dan","time_slot":"morning"},"w":"Dọn cỏ rậm ở bờ ruộng.","s":"Khua gậy dài tạo tiếng động 'đánh động' rắn.","r":"Trực tiếp dùng tay và liềm thò vào lùm cỏ rậm rạp.","o":"Một con rắn lục đuôi đỏ trườn nhanh ra khỏi chỗ nấp bỏ đi.","q":"Làm đồng bao năm mà lần này chủ quan không khua gậy đi trước...","l":"Rắn độc thường nằm lẩn khuất trong các bụi cỏ rậm. Quy tắc an toàn là luôn mang ủng và dùng gậy dài khua đập bụi rậm trước khi thao tác bằng tay.","k":"poison"},{"id":"xd_05","n":"Cẩu thả hố thang máy","c":{"job":"xay_dung","time_slot":"work_1"},"w":"Đang thi công trên tầng cao.","s":"Mang ván, lưới ra rào chắn miệng hố.","r":"Đi men sát bờ miệng hố thang máy rỗng.","o":"Khu vực an toàn, bạn và các đồng nghiệp làm việc yên tâm.","q":"Người ta nói hố thang máy trên công trình chưa rào chắn mà không ai để ý...","l":"Ngã xuống hố thang máy hoặc các lỗ hở sàn là tai nạn chết người rất dễ gặp ở các công trình cao tầng. Bắt buộc phải rào chắn cứng hoặc đậy kín các lỗ hở sàn ngay lập tức.","k":"fall"},{"id":"xd_06","n":"Nắng nóng bốc hỏa","c":{"job":"xay_dung","time_slot":"lunch","season":"summer"},"w":"Làm việc trên mái nhà lúc mặt trời đứng bóng.","s":"Bỏ việc tạm thời, xuống tầng dưới bóng râm nghỉ ngơi.","r":"Cố sức làm nốt phần việc trên mái nhà giữa trưa nắng gắt.","o":"Cơ thể hạ nhiệt và hồi phục, tránh được cơn sốc nhiệt.","q":"Cứ muốn làm cho xong việc để nghỉ sớm, ai ngờ bị say nắng ngã từ trên mái xuống...","l":"Lao động cường độ cao dưới trời nắng gắt có thể gây lú lẫn và ngất xỉu. Ngất xỉu khi làm việc trên cao luôn dẫn đến những cú ngã chí mạng.","k":"heat"},{"id":"tm_05","n":"Mìn lép nguy hiểm","c":{"job":"tho_mo","time_slot":"work_1"},"w":"Quay lại vỉa than sau đợt nổ mìn phá đá.","s":"Lùi ra xa và báo cáo ngay cho đội chuyên trách mìn.","r":"Phớt lờ, dùng cuốc chim đào đất đá gần thỏi mìn.","o":"Đội an toàn đến xử lý quả mìn lép thành công.","q":"Làm thợ mỏ bao năm, dặn đi dặn lại là thấy mìn lép phải tránh xa...","l":"Mìn nổ sót (mìn lép) cực kỳ nhạy cảm với ma sát và va đập cơ học. Tuyệt đối không tự ý xử lý hay đào bới xung quanh khu vực có mìn chưa nổ.","k":"mine"},{"id":"tm_06","n":"Bụi than tĩnh điện","c":{"job":"tho_mo","time_slot":"work_2"},"w":"Hệ thống phun sương dập bụi bị hỏng.","s":"Khắc phục sự cố phun sương, dập bụi trong không khí.","r":"Bật lửa hút thuốc trong môi trường không khí đầy bụi than.","o":"Không khí trong lại, dễ thở và khu vực mỏ trở lại trạng thái an toàn.","q":"Quy định cấm mang bật lửa xuống lò là có lý do của nó, sao lại nông nổi thế...","l":"Bụi than lơ lửng trong không khí ở nồng độ cao có thể phát nổ dữ dội chỉ với một tia lửa nhỏ, sức tàn phá khủng khiếp không kém nổ khí metan.","k":"mine"},{"id":"td_05","n":"Không gian hạn hẹp","c":{"job":"tho_dien","time_slot":"work_2"},"w":"Chui xuống sửa ngầm dưới hố cáp hẹp.","s":"Dọn dẹp tạo khoảng không và lối rút lui thông thoáng.","r":"Chui đầu vào góc kẹt vướng víu với lối thoát bị chặn cứng.","o":"Khi có tia lửa điện xẹt nhẹ, bạn dễ dàng nhảy lùi lại thoát thân.","q":"Làm điện dưới hố hẹp chật chội, lúc có sự cố vùng vẫy không ra được...","l":"Sửa chữa điện trong không gian hạn hẹp (hố ga, đường hầm) yêu cầu phải luôn đảm bảo lối thoát hiểm thông thoáng để kịp thời lùi lại khi có rò rỉ điện.","k":"electric"},{"id":"td_06","n":"Búi cáp viễn thông","c":{"job":"tho_dien","time_slot":"morning"},"w":"Đang thao tác trên cột lưới hạ thế.","s":"Dùng bút thử điện kiểm tra tất cả trước khi chạm tay.","r":"Đinh ninh cáp viễn thông không có điện nên dùng tay không kéo dẹp sang một bên.","o":"Bút thử điện kêu báo động vỏ cáp viễn thông bị nhiễm điện, bạn tránh được bẫy chết người.","q":"Cứ tưởng là dây cáp viễn thông bình thường không giật, ai ngờ nó chạm chập với điện lưới...","l":"Dây cáp viễn thông chằng chịt trên cột thường xuyên bị nhiễm điện nguy hiểm do cọ xát vào lưới điện. Luôn coi mọi dây dẫn trên cột đều mang điện.","k":"electric"},{"id":"ev_01","n":"Chuyến xe cuối năm","c":{"job":"all","time_of_year":"Tet"},"w":"Chỉ còn vài tiếng nữa là giao thừa.","s":"Đi thật chậm, nhường nhịn xe chở hàng cồng kềnh.","r":"Vượt lấn làn ngược chiều để kịp về nhà đón giao thừa.","o":"Về nhà an toàn, cùng gia đình xem pháo hoa.","q":"Nồi bánh chưng đã chín rồi mà anh ấy không về kịp đón giao thừa...","l":"Dịp cận Tết là thời điểm tai nạn giao thông tăng vọt do tâm lý vội vã và chở hàng cồng kềnh. Đi chậm lại một chút để Tết được trọn vẹn bên gia đình.","k":"car"},{"id":"ev_02","n":"Tro tàn ngày rằm","c":{"job":"all","time_of_month":"Ram"},"w":"Hôm nay là ngày rằm.","s":"Dập tắt tàn lửa triệt để bằng nước.","r":"Chủ quan bỏ vào nhà, để mặc tàn lửa đỏ trong đống giấy.","o":"Ngăn chặn thành công một vụ cháy lan.","q":"Mâm cúng rằm mới bày ra mà ngọn lửa đã thiêu rụi cả căn nhà...","l":"Bất cẩn khi đốt vàng mã là nguyên nhân gây ra nhiều vụ hỏa hoạn đau lòng ở khu dân cư. Phải luôn có vật dụng che chắn và dập tàn tro bằng nước triệt để.","k":"fire"},{"id":"ev_03","n":"Biển quảng cáo chao đảo","c":{"job":"all","season":"typhoon"},"w":"Bão đang đổ bộ, gió rít từng cơn mạnh cấp 10.","s":"Tìm nơi trú ẩn kiên cố, chờ ngớt gió bão.","r":"Đánh cược vận may, cố chạy qua khu vực nguy hiểm.","o":"Tấm tôn khổng lồ rơi rầm xuống đường ngay sau lưng bạn.","q":"Đã dặn bão lớn thì tìm chỗ trú, đừng cố chạy về làm gì cho khổ thân...","l":"Gió bão giật mạnh có thể biến các tấm tôn, biển quảng cáo thành những cỗ máy chém lơ lửng. Tuyệt đối không ra đường hoặc đứng dưới kết cấu yếu khi có bão.","k":"struck"},{"id":"ev_04","n":"Chén rượu ngày lương","c":{"job":"all","time_of_month":"payday"},"w":"Ngày nhận lương, đồng nghiệp rủ đi nhậu.","s":"Bỏ xe lại quán, gọi xe công nghệ chở về.","r":"Tự tin rằng 'mình vẫn còn tỉnh', tự lái xe về trong đêm.","o":"Ngủ một giấc ngon lành ghế sau ô tô, về nhà an toàn dẫu tốn chút tiền xe.","q":"Tháng lương đầu tiên định mua quà cho con, ai ngờ lại là bữa nhậu cuối cùng...","l":"Rượu bia làm mất khả năng phán đoán và làm chậm phản xạ vận động. Đã uống rượu bia, tuyệt đối không tự lái xe dưới bất kỳ hình thức nào.","k":"car"},{"id":"ev_05","n":"Cơn sốt lúc nửa đêm","c":{"job":"all","family_status":"has_child","time_slot":"evening"},"w":"Hai giờ sáng, đứa con nhỏ quấy khóc lịm đi.","s":"Gọi xe ô tô/cấp cứu, ngồi ghế sau ôm con an toàn.","r":"Tự lái xe máy bằng một tay trong trạng thái tinh thần hoảng loạn.","o":"Đến viện kịp thời, bác sĩ hạ sốt cho con.","q":"Vì quá xót con mà mất đi sự tỉnh táo, gây ra tai nạn đau lòng...","l":"Sự hoảng loạn khi người thân gặp nạn thường dẫn đến hành vi lái xe cực kỳ nguy hiểm. Sử dụng taxi hoặc xe cấp cứu là cách nhanh và an toàn nhất.","k":"car"},{"id":"ev_06","n":"Chuyến xe vội vã về quê","c":{"job":"all","family_status":"parents_in_hometown"},"w":"Nghe tin mẹ già ở quê bị tai nạn nhập viện.","s":"Lên tiếng phản đối mạnh mẽ, ép tài xế đi đúng tốc độ hoặc xuống xe.","r":"Ngồi im phó mặc mạng sống cho tài xế chạy ẩu.","o":"Tài xế hậm hực giảm tốc.","q":"Mẹ chỉ bị gãy tay nhẹ, sao con lại bỏ mẹ mà đi thế này...","l":"Đừng để sự nôn nóng cướp đi sinh mạng của chính mình. Phải luôn lên tiếng tự bảo vệ bản thân hoặc từ chối đi những chuyến xe phóng nhanh vượt ẩu lấn làn.","k":"car"},{"id":"ev_07","n":"Khoảnh khắc bình yên","c":{"job":"all","time_slot":"evening"},"w":"Chiều tan tầm về ngang công viên.","s":"Dừng lại giúp đỡ người qua đường.","r":"N/A","o":"Cụ già mỉm cười hiền từ cảm ơn bạn.","q":"Không áp dụng.","l":"Hạnh phúc đôi khi không phải là điều gì lớn lao, mà chỉ đơn giản là trải qua một ngày bình an trọn vẹn và biết đưa tay giúp đỡ những người xung quanh.","k":""},{"id":"nm_05","n":"Núi vải chao đảo","c":{"job":"nha_may","time_slot":"work_1"},"w":"Vào kho lấy nguyên liệu.","s":"Lùi ra xa và gọi người có trách nhiệm đến xử lý.","r":"Cố gắng chạy vào rút cuộn vải để kịp chỉ tiêu chuyền may.","o":"Ngay khi bạn lùi lại, đống vải đổ ầm xuống nền.","q":"Nó bảo phải lấy đủ vải mới kịp tiến độ của tổ, ai ngờ kho hàng lại sập...","l":"Hàng hóa xếp dỡ sai quy định, xếp quá cao và không có giá đỡ chắc chắn là nguy cơ tiềm ẩn gây tai nạn đè ép nghiêm trọng trong các nhà máy.","k":"struck"},{"id":"nm_06","n":"Mũi kim oan nghiệt","c":{"job":"nha_may","time_slot":"work_2","habit":"voi_vang"},"w":"Đang đạp máy may công nghiệp tốc độ cao thì chỉ bị đứt.","s":"Tắt công tắc nguồn điện của máy trước khi thao tác.","r":"Không tắt máy, ráng xỏ chỉ qua mũi kim sắt hẹp.","o":"Xỏ chỉ an toàn, bật máy và tiếp tục công việc.","q":"Làm thợ may bao năm, chỉ vì vội một thao tác xỏ chỉ mà xảy ra chuyện...","l":"Tuyệt đối phải ngắt điện thiết bị trước khi đưa tay vào vùng nguy hiểm của máy móc để bảo trì, sửa chữa hoặc thay linh kiện nhỏ nhất.","k":""},{"id":"nm_07","n":"Cổng xưởng tan tầm","c":{"job":"nha_may","time_slot":"commute"},"w":"Chuông tan ca reo vang.","s":"Kiên nhẫn đứng chờ xe lớn đi qua khu vực cổng.","r":"Chen lấn, chạy cắt mặt xe container cùng đám đông.","o":"Về trễ vài phút nhưng thoát khỏi khu vực lộn xộn một cách an toàn.","q":"Tan ca ai cũng mệt mỏi muốn về nhà thật nhanh, không ai chịu nhường ai...","l":"Cổng khu công nghiệp giờ tan tầm rất dễ xảy ra tai nạn liên hoàn do ùn tắc. Kiên nhẫn nhường đường cho xe tải trọng lớn là cách bảo vệ chính mình.","k":"car"}];
const SCN_JOB={van_phong:'vanphong',giao_hang:'shipper',tho_mo:'thomo',xe_tai:'taixe',nong_dan:'nongdan',ngu_dan:'ngudan',sinh_vien:'sinhvien',ban_rong:'hangrong',xay_dung:'xaydung',nha_may:'may',tho_dien:'thodien'};
const SCN_VEH={xe_may:['xemay','grabbike'],o_to:['oto','grabcar'],di_bo:['dibo'],xe_buyt:['bus','shuttle'],xe_tai:['oto']};
const SCN_SLOT={morning:.06,commute:.2,work_1:.36,lunch:.5,work_2:.66,evening:.85};
Object.assign(VERB_ICO,{'An toàn':'check','Làm liều':'warn'});
function scnHist(){try{return JSON.parse(localStorage.getItem('ngaycuoi.scn')||'{}')}catch(_){return {}}}
function scnSave(h){try{localStorage.setItem('ngaycuoi.scn',JSON.stringify(h))}catch(_){}}
function scnNow(){const d=window.__scnDate||new Date();let lm=0,ld=0;try{const p=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric'}).formatToParts(d);lm=parseInt(p.find(x=>x.type==='month').value)||0;ld=parseInt(p.find(x=>x.type==='day').value)||0}catch(_){}return {m:d.getMonth()+1,d:d.getDate(),w:d.getDay(),lm,ld}}
function scnFit(x,N){const c=x.c,J=job(),H=PF.hl,Fam=PF.fam||[];let w=3;
const js=[].concat(c.job);if(!js.includes('all')){if(!js.some(j=>SCN_JOB[j]===J))return 0;w=6}
if(c.vehicle){const v=[].concat(c.vehicle).flatMap(k=>SCN_VEH[k]||[]);if(!v.includes(PF.xe)&&!(J==='taixe'&&[].concat(c.vehicle).includes('xe_tai')))return 0;w+=4}
if(c.health&&c.health!=='all'){if(!({huyet_ap:H.ha,di_ung:H.haisan,thieu_ngu:H.ngu})[c.health])return 0;w+=4}
if(c.season){const ok={rainy:(N.m>=5&&N.m<=10)||G.wx==='mua',summer:(N.m>=3&&N.m<=6)||G.wx==='nong',typhoon:N.m>=9&&N.m<=11}[c.season];if(!ok)return 0;w+=4}
if(c.time_of_year==='Tet'){if(!((N.lm===12&&N.ld>=23)||(N.lm===1&&N.ld<=7)))return 0;w+=8}
if(c.time_of_month){const ok={end:N.d>=26,payday:N.d<=5,Ram:N.ld>=14&&N.ld<=16}[c.time_of_month];if(!ok)return 0;w+=6}
if(c.day_of_week){const D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][N.w];if(![].concat(c.day_of_week).includes(D))return 0;w+=4}
if(c.location){if(![].concat(c.location).some(l=>(PF.thanhPho||'').includes(l)))return 0;w+=4}
if(c.family_status==='has_child'){if(!Fam.some(m=>m.qh==='Con'))return 0;w+=4}
if(c.family_status==='parents_in_hometown'){if(!Fam.some(m=>m.qh==='Mẹ'||m.qh==='Bố'))return 0;w+=4}
return w}
function scnPlan(){G.scnQ=[];G.scnA=null;G.scnDone=[];if(CFG.lang!=='vi')return;const N=scnNow(),h=scnHist(),seen=new Set(h.seen||[]);if(h.died)seen.add(h.died);
let pool=SCN.map(x=>({x,w:scnFit(x,N)})).filter(o=>o.w>0);if(pool.filter(o=>!seen.has(o.x.id)).length>=3)pool=pool.filter(o=>!seen.has(o.x.id));
const used=new Set(),pick=[];while(pick.length<3&&pool.length){const t=pool.reduce((a,o)=>a+o.w,0);let r=Math.random()*t,i=0;for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break}const o=pool.splice(i,1)[0];const sl=o.x.c.time_slot||'any';if(sl!=='any'&&used.has(sl))continue;used.add(sl);pick.push(o.x)}
G.scnQ=pick.map(x=>({x,at:x.c.time_slot?SCN_SLOT[x.c.time_slot]:.3+Math.random()*.5})).sort((a,b)=>a.at-b.at);
h.seen=[...pick.map(x=>x.id),...(h.seen||[])].slice(0,18);h.died=null;scnSave(h);track('scn_plan')}
function scnSpot(){const y=Math.round(P.y),ok=(x,z)=>{for(let t=.2;t<=1.001;t+=.2)if(!walkable(Math.floor(P.x+(x-P.x)*t),y,Math.floor(P.z+(z-P.z)*t)))return false;return true},c=[];for(const d of [3,2.4,4,1.8])for(let k=0;k<16;k++){const off=(k%2?1:-1)*Math.ceil(k/2)*Math.PI/8,a=P.yaw+off,x=P.x+Math.sin(a)*d,z=P.z+Math.cos(a)*d;if(ok(x,z))c.push([x,z])}for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)if(Math.hypot(c[i][0]-c[j][0],c[i][1]-c[j][1])>=2.6)return [c[i],c[j]];return null}
const SCN_GEO=new THREE.CylinderGeometry(.6,.6,3.4,14,1,true);
function scnPost(p,col){const m=new THREE.Mesh(SCN_GEO,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.34,side:THREE.DoubleSide,depthWrite:false}));m.position.set(p[0],P.y+1.7,p[1]);scene.add(m);return m}
function scnBanner(x,hint){const b=$('#scn');b.innerHTML=`<div class="t">${ico('warn',18)}<b>${esc(x.n)}</b></div><div class="w">${esc(x.w)}</div>${hint?`<div class="h">${esc(hint)}</div>`:''}<i id="scnb"></i>`;b.hidden=false}
function scnClear(){const a=G.scnA;if(a){(a.meshes||[]).forEach(m=>{scene.remove(m);m.material.dispose()});if(a.its)G.items=G.items.filter(i=>!a.its.includes(i))}G.scnA=null;const b=$('#scn');if(b)b.hidden=true}
function scnStart(q){const x=q.x;G.scnDone.push(x);snd('ding');buzz(30);shake(.12);track('scn_show');
if(P.ride&&P.ride.on){G.scnA={x,ride:true};talk(x.n,x.w,[{t:x.s,f(){scnEnd(true)}},{t:x.r,f(){scnEnd(false)}}]);return}
if(P.veh){G.scnA={x,veh:true,t:6,T:6};scnBanner(x,'Giảm tốc ngay');return}
const sp=scnSpot();if(!sp){G.scnDone.pop();q.tries=(q.tries||0)+1;if(q.tries<8){G.scnQ.unshift(q);G.scnWait=2}return}
const A={x,t:14,T:14,meshes:[scnPost(sp[0],0x62f0b5),scnPost(sp[1],0xff5a6e)]};
A.its=[{x:sp[0][0],z:sp[0][1],y:P.y+1.8,verb:'An toàn',hint:x.s,use(){scnEnd(true)}},{x:sp[1][0],z:sp[1][1],y:P.y+1.8,verb:'Làm liều',hint:x.r,use(){scnEnd(false)}}];
G.items.push(...A.its);G.scnA=A;scnBanner(x,'Xanh: an toàn · Đỏ: làm liều')}
function scnEnd(safe,late){const a=G.scnA;if(!a||G.mode!=='day')return;const x=a.x;scnClear();x.res=safe;
if(safe){logx(x.n,'good');snd('quest');burst(P.x,P.y+1,P.z,0x62f0b5,16,2.6,4);say('',x.o);track('scn_safe');return}
logx(x.n,'risk');track('scn_risk');shake(.3);buzz(50);if(late)toast('Không kịp phản ứng.',2000);
if(x.k&&!G.fate&&Math.random()<RISK.scnFatal){G.scnKill=x;const h=scnHist();h.died=x.id;scnSave(h);cv.style.filter='blur(2px) grayscale(.6)';G.tilt=.06;snd('beat');later(1.5,()=>die(x.k));return}
say('','Suýt nữa thì…')}
function scnStep(dt){if(!G.scnQ)return;const a=G.scnA;
if(a){if(a.ride)return;a.t-=dt;const b=$('#scnb');if(b)b.style.width=Math.max(0,a.t/a.T*100)+'%';
if(a.veh){if(!P.veh||Math.abs(P.veh.s)<1.5)scnEnd(true);else if(a.t<=0)scnEnd(false,true);return}
if(a.t<=0)scnEnd(false,true);return}
if(G.scnWait>0){G.scnWait-=dt;return}if(!G.scnQ.length||G.qi<3||P.busy||G.dlg||G.paused||G.fate&&G.qi>=G.fate.at)return;const f=G.qi/G.Q.length;if(f<G.scnQ[0].at)return;
const road=P.z>=0&&P.z<=8&&G.floor===0&&!P.veh&&!(P.ride&&P.ride.on);if(road||(P.veh&&Math.abs(P.veh.s)<3))return;scnStart(G.scnQ.shift())}
</script>
<script>
// ===== Điều khiển =====
const keys={},padK={};
const GAMEKEYS=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight'];
addEventListener('keydown',e=>{const tag=e.target.tagName;if(tag==='INPUT'||tag==='SELECT')return;keys[e.code]=true;
if(GAMEKEYS.includes(e.code)&&(G.mode==='day'||G.mode==='after'))e.preventDefault();if(e.repeat)return;
const dg=/^Digit([1-5])$/.exec(e.code);if(dg&&G.dlg){const b=document.querySelectorAll('#dopts .btn')[dg[1]-1];if(b)b.click();return}
if(e.code==='KeyE')useItem();if(e.code==='KeyQ')phone();if(e.code==='KeyV')P.first=!P.first;if(e.code==='KeyI')toggleInv();
if(e.code==='Space')jump()});
addEventListener('keyup',e=>{keys[e.code]=false});
function jump(){if(P.ground&&!P.busy&&!P.veh&&!(P.ride&&P.ride.on)&&(G.mode==='day'||G.mode==='after')){P.vy=7.4;burst(P.x,.1,P.z,0xd8d4ff,6,1.4,5);if(G.tut)G.tut.jump=true}}
document.querySelectorAll('#pad .tb').forEach(b=>{const k=b.dataset.k,off=()=>{padK[k]=false;b.classList.remove('on')};
b.addEventListener('pointerdown',e=>{e.preventDefault();padK[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}});
b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('contextmenu',e=>e.preventDefault())});
let drag=null;
