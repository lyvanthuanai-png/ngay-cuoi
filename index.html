<!doctype html>
<meta charset="utf-8">
<title>Ngày cuối</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Game thử: sống một ngày đi làm của chính bạn, gặp rủi ro thật của nghề, rồi học cách phòng tránh.">
<meta name="theme-color" content="#1f1a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Spectral:wght@400;500&display=swap">
<style>
/* Canvas 3D phủ kín màn hình; bảng nhiệm vụ, nút điều khiển, hội thoại nổi bên trên. Màn chết là đen tuyệt đối. */
:root{color-scheme:dark;--ink:#1f1a26;--panel:#1f1a26ee;--line:#574a5e;--lamp:#e3a24f;--paper:#f1e4d3;--mute:#c4b0ab;--ember:#d68a6a;--ok:#9cc98a;
--display:"Spectral",Georgia,serif;--body:"Be Vietnam Pro",system-ui,-apple-system,sans-serif}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.5 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
canvas#g{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;transition:filter 1.2s}
.pn{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
#clock{top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:4px 10px;font-weight:600;font-variant-numeric:tabular-nums}
#quest{top:calc(50px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:8px 12px;font-size:14px;width:min(300px,calc(100vw - 200px));min-width:200px}
#quest .now{font-weight:600;color:var(--lamp);font-size:15px}
#quest .done{color:var(--mute);text-decoration:line-through}
#quest .next{color:var(--mute)}
#quest .opt{color:#e8c99a}
#quest div{padding:1px 0}
#quest .bar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
#quest .bar i{flex:1;height:6px;border-radius:3px;background:#3a3242;overflow:hidden;display:block}
#quest .bar b{display:block;height:100%;background:var(--ember)}
#mini{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:150px;height:110px;border:1px solid var(--line);border-radius:6px;background:#2a2430;image-rendering:pixelated}
#toast{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 12px;font-size:14px;max-width:min(60vw,420px);text-align:center}
#prompt{bottom:calc(140px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:6px 12px;font-size:14px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#bub{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 12px;max-width:min(300px,70vw);font:400 16px/1.4 var(--display);pointer-events:none;box-shadow:0 2px 0 #0004}
#bub .who{color:#9a4a2a;font:600 12px var(--body)}
#bub:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--paper)}
#dlg{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 32px))}
#dlg .row{display:flex;flex-wrap:wrap;gap:8px}
#dlg .btn{width:auto;flex:1 1 auto}
.btn{font:inherit;min-height:42px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--paper);cursor:pointer;text-align:left;width:100%}
.row .btn{white-space:nowrap}
.btn:hover{border-color:var(--lamp)}
.btn:focus-visible,.chip:focus-visible,.sw:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.main{background:var(--lamp);border-color:var(--lamp);color:#2a1c10;font-weight:600;text-align:center}
.tb{position:fixed;background:#1f1a26cc;border:1px solid var(--line);color:var(--paper);font:600 14px var(--body);border-radius:8px;min-width:64px;min-height:52px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.tb.on,.tb:active{background:var(--lamp);color:#2a1c10;border-color:var(--lamp)}
#pad{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,54px);gap:6px}
#pad .tb{position:static;min-width:0;font-size:22px}
#pad .rot{font-size:20px;opacity:.85}
#ta{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));min-width:116px;min-height:64px;font-size:16px}
#ta.has{background:var(--lamp);color:#2a1c10;border-color:var(--lamp)}
#tj{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));min-width:54px}
#tr{right:calc(max(16px,env(safe-area-inset-right,0px)) + 62px);bottom:calc(16px + env(safe-area-inset-bottom,0px));min-width:54px}
#tq{right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));min-height:40px}
#tbag{right:calc(max(12px,env(safe-area-inset-right,0px)) + 104px);top:calc(10px + env(safe-area-inset-top,0px));min-height:40px;min-width:54px}
#inv{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:220px;font-size:14px}
#help{bottom:calc(140px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));padding:6px 10px;font-size:13px;color:var(--mute);max-width:calc(100vw - 24px)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
@media(max-width:600px){#mini{width:104px;height:76px;top:calc(56px + env(safe-area-inset-top,0px))}#quest{width:auto;min-width:0;right:128px;font-size:13px;padding:6px 10px}#quest .now{font-size:14px}#toast{top:auto;bottom:calc(200px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px)}#help{font-size:12px}}
/* Màn nhập hồ sơ */
#wiz{right:16px;top:16px;bottom:16px;width:min(400px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;overflow:auto}
@media(max-width:759px){#wiz{left:16px;right:16px;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:64vh;width:auto}}
h1{font:400 40px/1.05 var(--display);margin:0}
h2{font:500 22px/1.2 var(--display);margin:0}
.dim{color:var(--mute);font-size:14px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14px;min-height:36px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--paper);cursor:pointer}
.chip.on{border-color:var(--lamp);color:var(--lamp)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.sw{width:32px;height:32px;border:2px solid var(--ink);outline:1px solid var(--line);border-radius:4px;cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--lamp)}
label{font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
input[type=range]{width:100%;accent-color:var(--lamp)}
input[type=text],input[type=number],select{font:inherit;color:var(--paper);background:#2f2838;border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:6px;padding:8px;position:relative}
.fam .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer}
.ck{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--paper);justify-content:flex-start}
.ck input{width:20px;height:20px;accent-color:var(--lamp)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--lamp)}
.rel{display:flex;flex-direction:column;gap:6px}
.rel .chip{text-align:left;padding:8px 12px}
.rel .chip small{display:block;color:var(--mute);font-size:12px}
.card-p{font:400 18px/1.45 var(--display);background:#2a2430;border-radius:6px;padding:12px}
.fact{font-size:13px;color:var(--mute);border-left:3px solid var(--lamp);padding-left:8px}
/* Màn đen, thẻ báo tử, bài học */
#black{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;overflow:auto}
#black .big{font:500 clamp(34px,9vw,68px)/1.05 var(--display);letter-spacing:.04em;color:#f3e6d6}
#black .when{font:400 17px var(--body);color:var(--mute)}
#black .cause{font:500 clamp(28px,6vw,40px)/1.2 var(--display);color:var(--ember)}
#black .next{font:italic 400 17px/1.4 var(--display);color:var(--lamp)}
#sheet{left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px}
#sheet ul{margin:0;padding-left:20px}#sheet li{margin:3px 0}
.good{color:var(--ok)}.bad{color:var(--ember)}
.q{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.fade{animation:f 1.2s ease both}@keyframes f{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}canvas#g{transition:none}}
</style>

<button id="tj" class="tb" type="button" hidden>Nhảy</button>

<div id="dlg" class="pn" hidden></div>
<div id="wiz" class="pn" hidden></div>

<div id="black" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOUCH=window.matchMedia('(pointer:coarse)').matches;
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.floor(m)%60).padStart(2,'0');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hm=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ===== Cảnh 3D, ánh sáng, bầu trời =====
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.25:1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const cv=renderer.domElement;cv.id='g';cv.tabIndex=0;document.body.prepend(cv);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,260);
// Màn hình dọc (điện thoại) cần góc nhìn rộng hơn để thấy quanh nhân vật.
const fitCam=()=>{camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?80:66;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};fitCam();addEventListener('resize',fitCam);
const hemi=new THREE.HemisphereLight(0xffffff,0x665544,.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.9);scene.add(sun);scene.add(sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:170});sun.shadow.bias=-.0006;
const fillL=new THREE.DirectionalLight(0xffffff,.3);fillL.position.set(-30,30,-30);scene.add(fillL);
scene.fog=new THREE.Fog(0xcfe3ea,45,140);
const UNIT=new THREE.BoxGeometry(1,1,1);
const skyMat=new THREE.ShaderMaterial({uniforms:{top:{value:new THREE.Color(0x6f9fd0)},bot:{value:new THREE.Color(0xcfe3ea)}},side:THREE.BackSide,depthWrite:false,fog:false,
vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=clamp(vP.y*1.4,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,.6)),1.);}'});
const dome=new THREE.Mesh(new THREE.SphereGeometry(230,24,12),skyMat);dome.renderOrder=-1;scene.add(dome);
const sunBox=new THREE.Mesh(new THREE.BoxGeometry(14,14,14),new THREE.MeshBasicMaterial({color:0xfff2c8,fog:false}));scene.add(sunBox);
const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x777777,transparent:true,opacity:.92,fog:false});
const CLOUDS=[];for(let i=0;i<18;i++){const g=new THREE.Group(),n=2+i%3;for(let j=0;j<n;j++){const b=new THREE.Mesh(UNIT,cloudMat);b.scale.set(8+((i*7+j*3)%9),1.6,5+((i*5+j)%5));b.position.set(j*6-n*3,0,(j%2)*3);g.add(b)}
g.position.set(-60+(i*37)%220,52+(i%4)*4,-110+(i*53)%220);scene.add(g);CLOUDS.push(g)}
const world=new THREE.Group();scene.add(world);
// Mưa: hạt rơi quanh camera.
const RAIN=(()=>{const n=1400,g=new THREE.BufferGeometry(),p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=Math.random()*60-30;p[i*3+1]=Math.random()*30;p[i*3+2]=Math.random()*60-30}
g.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.Points(g,new THREE.PointsMaterial({color:0xb8c8d8,size:.13,transparent:true,opacity:.75}));m.visible=false;m.frustumCulled=false;scene.add(m);return m})();
function rainStep(dt){if(!RAIN.visible)return;const a=RAIN.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-dt*24;if(y<0)y+=30;a.setY(i,y)}a.needsUpdate=true;RAIN.position.set(camera.position.x,0,camera.position.z)}
// Âm thanh tổng hợp, không cần tải file.
let AC=null,SOUND=true;
function snd(t){if(!SOUND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
const S={horn:['square',330,.3,.06],beat:['sine',52,.22,.7],bell:['sine',660,1.8,.22],beep:['square',1250,.12,.05],thunder:['sawtooth',38,1.4,.22],ding:['triangle',880,.35,.12]}[t];if(!S)return;
const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=S[0];o.frequency.value=S[1];o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(S[3],n);g.gain.exponentialRampToValueAtTime(.0001,n+S[2]);o.start(n);o.stop(n+S[2]+.05)}catch(_){}}
function flash(){const f=$('#flash');f.style.opacity=.85;setTimeout(()=>{f.style.opacity=0},120);snd('thunder')}

// ===== Thế giới khối =====
let solid=new Set(),blocks=new Map(),bounds=null;
const key=(x,y,z)=>x+','+y+','+z;
function put(x,y,z,c,s=true){blocks.set(key(x,y,z),c);if(s&&y>=0)solid.add(key(x,y,z))}
function fill(x1,y1,z1,x2,y2,z2,c,s=true){for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)for(let z=z1;z<=z2;z++)put(x,y,z,c,s)}
function clear(x1,y1,z1,x2,y2,z2){for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)for(let z=z1;z<=z2;z++){blocks.delete(key(x,y,z));solid.delete(key(x,y,z))}}
function room(x1,z1,x2,z2,wall,floor,roof,h=4){
fill(x1,0,z1,x2,h-1,z1,wall);fill(x1,0,z2,x2,h-1,z2,wall);fill(x1,0,z1,x1,h-1,z2,wall);fill(x2,0,z1,x2,h-1,z2,wall);
fill(x1,-1,z1,x2,-1,z2,floor,false);if(roof)fill(x1,h,z1,x2,h,z2,roof)}
// Vân khối 16x16 kiểu Minecraft: ảnh xám nhân với màu từng khối.
const KIND={0xd9c3a0:'plaster',0xe9e4d8:'plaster',0xe8c4c4:'plaster',0xe8e0c8:'plaster',0x8a4a3a:'roof',0xb5493e:'brick',0x9aa0a8:'stone',0x6a7078:'roof',0x6b4a2a:'bark',0x4f8a4a:'leaf',0xa9c9d6:'glass',
0x7a5a42:'wood',0x6a4a36:'wood',0x5d4c3e:'wood',0x4d3d31:'wood',0x7a4a30:'wood',0x6e3a30:'wood',0x3f2a2a:'wood',0xc9b18c:'wood',0x8a6a42:'wood',0x3a323e:'stone',0x4a3a52:'stone',0x1f1a22:'stone',0xc9c3b4:'win',0xb6bcc6:'win',
0xb0b5ba:'plaster',0x23262c:'stone',0xb0aca4:'stone',0x2a2a2e:'stone',0x5a5a5e:'stone',0x6f7a5a:'stone',0x7a8a6a:'stone',0xc8a050:'roof',0x3f6fa8:'plaster'};
const MATS={};
function mat(kind){if(MATS[kind])return MATS[kind];
const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');let sd=kind.length*977+13;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
const px=(i,j,v)=>{const g=Math.max(0,Math.min(255,Math.round(255*v)));x.fillStyle=`rgb(${g},${g},${g})`;x.fillRect(i,j,1,1)};
for(let i=0;i<16;i++)for(let j=0;j<16;j++){let v=.9+r()*.1;const e=i===0||j===0||i===15||j===15;
if(kind==='brick'){const row=j>>2;v=(j%4===3||i===(row%2?3:11))?.7:.86+r()*.14}
else if(kind==='roof')v=j%4===3?.66:j%4===0?1:.84+r()*.1;
else if(kind==='stone')v=r()<.18?.72+r()*.1:e?.8:.9+r()*.08;
else if(kind==='plaster')v=e?.86:.93+r()*.07;
else if(kind==='wood')v=j%4===3?.68:(i===(j>>2)*5%16?.78:.86+r()*.12);
else if(kind==='bark')v=i%4===0?.7:.82+r()*.15;
else if(kind==='leaf')v=r()<.14?.42:.62+r()*.42;
else if(kind==='glass')v=e?.75:(i===j||i===j+1)?1:.92;
else if(kind==='win')v=(i>=2&&i<=6||i>=9&&i<=13)&&j>=3&&j<=11?(j===3?.32:.42):.94+r()*.06;
else v=e?.84:v;px(i,j,v)}
const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
return MATS[kind]=new THREE.MeshLambertMaterial(kind==='glass'?{map:t,transparent:true,opacity:.5}:{map:t})}
const css=(h,f)=>{const c=new THREE.Color(h);return 'rgb('+[c.r,c.g,c.b].map(v=>Math.min(255,Math.round(v*f*255))).join(',')+')'};
const C_GRASS=0x7fa35c,C_ROAD=0x5f6369,C_LINE=0xe8e4d8,C_WALK=0xb8b2a6,C_DIRT=0x9a8a6a,C_SITE=0x8a7a5a,C_RICE=0x6f9a3a,C_WATER=0x3f7fa8,C_CANAL=0x5a7a8a,C_SAND=0xe0d0a0,C_COAL=0x4a4a4a,C_YEL=0xe0c040;

<div class="row"><button type="button" class="chip ${!PF.dai?'on':''}" data-dai="0">Tóc ngắn</button><button type="button" class="chip ${PF.dai?'on':''}" data-dai="1">Tóc dài</button></div>
<div class="fld"><label>Màu áo</label><div class="row" data-k="ao"></div></div>`}
if(WP===1){const tr=transFor();if(!tr.includes(PF.xe))PF.xe=tr[0];
h+=`<div class="fld"><label>Nghề</label><div class="row">${Object.keys(JOBS).map(k=>`<button type="button" class="chip ${PF.nghe===k?'on':''}" data-job="${k}">${JOBS[k].name}</button>`).join('')}</div></div>

<div class="fld"><label>Đi làm bằng</label><div class="row">${tr.map(t=>`<button type="button" class="chip ${PF.xe===t?'on':''}" data-xe="${t}">${TRANS[t]}</button>`).join('')}</div></div>

if(WP===5){h+=`<div class="card-p">${esc(summary())}</div><p class="dim">Bảng góc trái chỉ bạn đi đâu, làm gì. Có những lựa chọn nhỏ làm tăng hay giảm rủi ro.</p>`}
h+=`<div class="row" style="margin-top:auto;flex-wrap:nowrap">${WP>0?'<button class="btn" type="button" id="back" style="width:auto">Quay lại</button>':''}<button class="btn" type="button" id="rnd" style="width:auto">Ngẫu nhiên</button>

b.onclick=()=>{PF[k]=v;r.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');buildPlayer(false)};r.appendChild(b)})});

['tuoi','cao','nang'].forEach(k=>{const e=$('#'+k);if(e)e.oninput=()=>{PF[k]=+e.value;upd();buildPlayer(false)}});

<script>
// ===== Dựng thế giới theo hồ sơ =====
// Nhà x0–14 z14–26 (nam đường) · đường z0–8 · vạch qua đường x29–35 · quán x16–26, tiệm bánh x38–46 (thành phố)

const PROPS={},DOORS={};
const ZONE_OF={vanphong:'office',shipper:'office',sinhvien:'office',hangrong:'office',xaydung:'site',may:'factory',thodien:'power',thomo:'mine',taixe:'depot',nongdan:'farm',ngudan:'pier'};
function door(id,x1,z1,x2,z2,c,needs){const w=x2-x1+1,d=z2-z1+1,along=w>=d;
const m=box(world,along?w:.22,2.2,along?.22:d,x1+w/2,1.1,z1+d/2,c);
const o={m,cells:[],open:false,needs};for(let x=x1;x<=x2;x++)for(let z=z1;z<=z2;z++)for(let y=0;y<=2;y++)o.cells.push(key(x,y,z));
o.set=v=>{o.open=v;m.visible=!v;o.cells.forEach(k=>v?solid.delete(k):solid.add(k))};o.set(false);DOORS[id]=o;return o}
function lampPost(x,z,f){const g=new THREE.Group();box(g,.16,4.4,.16,0,2.2,0,0x3a3d44);box(g,.12,.12,1.1,0,4.35,f*.5,0x3a3d44);box(g,.42,.14,.5,0,4.25,f*1.05,0xfff0c8,{emissive:0xffe0a0,emissiveIntensity:.5});g.position.set(x,0,z);world.add(g)}

function tree(x,z,palm){if(palm){fill(x,0,z,x,5,z,0x8a6a42);fill(x-1,6,z,x+1,6,z,0x4f8a4a);fill(x,6,z-1,x,6,z+1,0x4f8a4a);return}
fill(x,0,z,x,3,z,0x6b4a2a);fill(x-2,4,z-2,x+2,5,z+2,0x4f8a4a);fill(x-1,6,z-1,x+1,6,z+1,0x4f8a4a)}

put(x,-1,z,c,false)}

fill(9,0,21,11,0,22,0x7a5a42);fill(13,0,23,13,0,25,0x6a4a36);put(13,1,24,0x3a3540);fill(13,0,15,13,1,16,0x6a4a36);fill(8,0,25,9,1,25,0x4f6f8c);
if(land==='city'){
room(16,12,26,20,0xb5493e,0x9a8a72,0xb5493e);clear(18,0,12,24,2,12);fill(17,0,18,19,0,19,0xc9b18c);fill(21,0,15,24,0,16,0x7a5a42);
room(38,12,46,19,0xe8c4c4,0xc8c2b6,0xb5493e);clear(40,0,12,44,2,12);fill(39,0,17,41,0,18,0xc9b18c);
for(let x=50;x<=96;x+=7)fill(x,0,24,x+5,7+(x%3)*2,28,x%2?0xc9c3b4:0xb6bcc6);

const VSPEC={moto:{max:11,acc:7,hl:.9},car:{max:12,acc:6,hl:1.95},truck:{max:9,acc:4,hl:3.3}};
function mount(m,type){P.veh={type,m,s:0,hl:VSPEC[type].hl};P.yaw=m.rotation.y+Math.PI/2;P.goto=null;if(type!=='moto')P.mesh.visible=false;toast(TOUCH?'▲ ga · ▼ phanh · ◀ ▶ lái':'W ga · S phanh · A D lái',3500)}
function dismount(){const v=P.veh;if(!v)return;const a=v.m.rotation.y,sx=Math.sin(a+Math.PI/2),sz=Math.cos(a+Math.PI/2);
let px=v.m.position.x-sz*1.4,pz=v.m.position.z+sx*1.4;if(hit(px,0,pz)){px=v.m.position.x+sz*1.4;pz=v.m.position.z-sx*1.4}P.x=px;P.z=pz;P.y=0;P.veh=null;P.mesh.visible=true;
if(!G.f.arrived&&near(dest(),9)){G.f.arrived=1;setTime(job()==='taixe'?'05:00':'07:40')}}
function protectedNow(){if(P.veh)return P.veh.type==='moto'?G.f.helmet==='strap':!!G.f.belt;if(P.ride)return P.ride.kind==='grabbike'?G.f.helmet==='strap':P.ride.kind==='grabcar'?!!G.f.belt:true;return false}
function crash(msg){if(G.mode!=='day')return;snd('horn');if(msg)toast(msg,2500);
if(protectedNow()&&Math.random()<RISK.protect){logx(P.veh&&P.veh.type==='moto'||P.ride&&P.ride.kind==='grabbike'?'Va chạm, nón cài quai giữ được':'Va chạm, dây an toàn giữ được','good');saved('crash')}else die(P.veh&&G.fat>85?'sleep':'car')}
// Xe do người khác lái: GrabBike, GrabCar, xe buýt, xe đưa đón, thuyền.
function callRide(kind){const city=LIGHT.on;let m,path,stopAt,hl;
if(kind==='grabbike'){m=moto(0x2e9d5f,0x2e9d5f,0x2e9d5f);hl=.9}else if(kind==='grabcar'){m=car(0x2e9d5f);hl=1.95}else if(kind==='boat'){m=PROPS.boat;hl=2.3}else{m=bus();hl=4}
if(kind==='boat'){P.ride={kind,m,hl,s:0,path:[[50,-16],[54,-30],[56,-44]],i:0,stage:'wait',on:false,max:4};return}
world.add(m);m.traverse(q=>{if(q.isMesh)q.castShadow=true});
const d=dest();
if(kind==='bus'){m.position.set(-22,0,6.5);path=[[16,6.5],[22,8.2]];stopAt=[[28,6.5],[40,6.5],[44,8.2]]}
else{m.position.set(-18,0,6.5);path=[[6,6.5],[10.5,8.2]];stopAt=[[16,6.5],[d[0]+12,6.5],[d[0]+15,4.5],[d[0]+12,2.5],[d[0]+3,2.5],[d[0],.9]]}
P.ride={kind,m,hl,s:0,path,i:0,stage:'come',on:false,next:stopAt,max:kind==='bus'||kind==='shuttle'?6:8};toast(kind==='bus'||kind==='shuttle'?'Xe đang tới.':'Tài xế đang tới, 1 phút.',2500)}
function boardRide(){const R=P.ride;if(!R)return;
const go=()=>{R.on=true;R.stage='go';if(R.kind!=='boat'){R.path=R.next;R.i=0}else{R.i=0}if(R.kind!=='grabbike'&&R.kind!=='boat')P.mesh.visible=false;P.goto=null;
if(R.kind==='grabbike'||R.kind==='grabcar')R.event=Math.random()<.6};
if(R.kind==='grabbike')talk('Tài xế','Nón nè anh chị, đội vô nha.',[{t:'Đội nón, cài quai',f(){G.f.helmet='strap';logx('Đội nón tài xế đưa, cài quai','good');go()}},{t:'Đội hờ cho mát',f(){G.f.helmet='loose';logx('Đội nón không cài quai','risk');go()}}]);
else if(R.kind==='grabcar')talk('','Ngồi ghế sau.',[{t:'Thắt dây an toàn',f(){G.f.belt=1;logx('Thắt dây an toàn ghế sau','good');go()}},{t:'Khỏi, ghế sau mà',f(){G.f.belt=0;logx('Không thắt dây an toàn','risk');go()}}]);
else if(R.kind==='boat')go();
else{if(G.inv.wallet){G.money-=7}logx(R.kind==='bus'?'Đi xe buýt':'Đi xe đưa đón công nhân','good');go()}}
function rideStep(dt){const R=P.ride;if(!R||!R.m)return;const m=R.m;
if(R.stage==='wait'||R.stage==='fish'){if(R.on){P.x=m.position.x;P.z=m.position.z}if(R.kind==='boat'&&G.storm)m.rotation.z=Math.sin(performance.now()*.004)*.18;return}
const tg=R.path[R.i];if(!tg){if(R.stage==='come'){R.stage='wait';snd('ding');toast(R.kind==='bus'?'Xe buýt tới rồi. Lên xe.':'Xe tới rồi. Lên xe.',2500)}else arriveRide();return}
const dx=tg[0]-m.position.x,dz=tg[1]-m.position.z,d=Math.hypot(dx,dz);
let tgt=R.max*(R.rush?1.5:1);if(LIGHT.on&&LIGHT.car!=='g'&&Math.abs(m.position.z-4)<4.5){if(dx>0&&m.position.x+R.hl<CW[0]-.4&&m.position.x+R.hl>CW[0]-7)tgt=Math.max(0,(CW[0]-.5-m.position.x-R.hl)*1.4);if(dx<0&&m.position.x-R.hl>CW[1]+1.4&&m.position.x-R.hl<CW[1]+8)tgt=Math.max(0,(m.position.x-R.hl-CW[1]-1.5)*1.4)}
if(d<2.5)tgt=Math.min(tgt,d*1.8+.5);R.s+=(tgt-R.s)*Math.min(1,dt*2.5);
if(d<.4){R.i++;return}const st=Math.min(d,R.s*dt);m.position.x+=dx/d*st;m.position.z+=dz/d*st;m.rotation.y=Math.atan2(-dz,dx);
if(R.kind==='boat'&&G.storm)m.rotation.z=Math.sin(performance.now()*.004)*.18;
if(R.on){P.x=m.position.x;P.z=m.position.z;P.yaw=m.rotation.y+Math.PI/2;
if(R.event&&R.i>=2&&!R.evDone){R.evDone=1;rideEvent(R)}}}

if(R.kind==='grabbike'){R.rush=true;talk('Tài xế','Trễ đơn rồi, chạy nhanh chút nha!',[{t:'"Anh chạy chậm lại giùm."',f(){R.rush=false;logx('Nhắc tài xế chạy chậm','good');say('Tài xế','Ừ, chạy từ từ.')}},{t:'"Ừ, nhanh lên."',f(){logx('Để tài xế chạy ẩu','risk');if(Math.random()<RISK.grabRush)later(1.5,()=>crash('Xe lạng lách, va vào xe khác!'))}}])}
else{talk('','Tài xế vừa lái vừa bấm điện thoại.',[{t:'"Anh tập trung lái giùm."',f(){logx('Nhắc tài xế tập trung','good');say('Tài xế','Xin lỗi, xin lỗi.')}},{t:'Kệ',f(){logx('Kệ tài xế dùng điện thoại','risk');if(Math.random()<RISK.grabPhone)later(2,()=>crash('Xe tông vào đuôi xe phía trước!'))}}])}}

const ax=R.m.position.x,az=R.m.position.z;P.x=ax;P.z=az<4?-1.8:9.8;P.y=0;P.mesh.visible=true;G.f.arrived=1;setTime(job()==='thomo'?'06:30':'07:40');

function allItems(){const L=JOBS_LOGIC[job()];return homeItems().concat(transItems(),L.items(),L.exit?[{x:L.exit[0],z:L.exit[1],y:1.6,verb:'Ra về',hint:'Ra về',on:()=>G.f.workDone&&!G.f.home&&!P.veh&&!P.ride,use(){goHome()}}]:[])}
function quests(){const L=JOBS_LOGIC[job()],self=job()==='shipper';

return [...homeQuests(),...(L.commute===false?[]:transQuests()),...L.quests(),...back,...(L.night||[{t:PF.fam.length?'Ăn tối cùng gia đình':'Ăn tối',at:[10,21.6],done:()=>G.f.dinner}])]}
function optional(){const K=kid(),out=[];

if(job()==='nongdan')out.push({t:'Lấy đèn pin ở kệ (đi đêm)',done:()=>G.inv.denpin});
if(job()==='taixe')out.push({t:'Buồn ngủ thì ghé trạm dừng nghỉ',done:()=>G.fat<20&&G.legs>0});
if(job()==='thomo'&&G.floor===12)out.push({t:'Kiểm tra vì chống',done:()=>G.f.checked});
return out.filter(o=>!o.show||o.show())}
function questStep(){const Q=G.Q;let n=0;while(G.qi<Q.length&&Q[G.qi].done()&&n++<6){if(Q[G.qi].on)Q[G.qi].on();G.qi++}
const box=$('#quest');let h='';
for(let i=Math.max(0,G.qi-1);i<Math.min(Q.length,G.qi+3);i++)h+=`<div class="${i<G.qi?'done':i===G.qi?'now':'next'}">${i<G.qi?'☑':i===G.qi?'▶':'☐'} ${esc(Q[i].t)}</div>`;
optional().forEach(o=>{h+=`<div class="opt">${o.done()?'☑':'☆'} ${esc(o.t)}</div>`});
if(JOBS_LOGIC[job()].outdoor||G.heat>5)h+=`<div class="bar">Nóng<i><b style="width:${Math.round(G.heat)}%"></b></i></div>`;
if(job()==='taixe')h+=`<div class="bar">Buồn ngủ<i><b style="width:${Math.round(G.fat)}%"></b></i></div>`;
if(box.dataset.h!==h){box.innerHTML=h;box.dataset.h=h}
const q=Q[G.qi];if(!q)return null;return typeof q.at==='function'?q.at():q.at||null}

<script>

if(G.oi===2&&G.ost===1&&!G.f.blind){const tr=VEH.find(q=>q.t==='t');if(!tr)return;

else{G.blindT-=dt;tr.m.position.z+=dt*.7;tr.z=tr.m.position.z;if(Math.abs(v.s)<3){G.f.blind=1;G.blindT=0;logx('Phanh kịp khi xe tải lấn làn','good');say('','Hú hồn!')}else if(G.blindT<=0){G.f.blind=1;G.blindT=0;logx('Chạy trong điểm mù xe tải','risk');crash('Xe tải ép vào!')}}}};

function closeTalk(){const was=G.dlg;$('#dlg').hidden=true;$('#bub').hidden=true;G.dlg=false;G.bub=null;if(was&&(G.mode==='day'||G.mode==='after'))['#pad','#ta','#tj','#tr'].forEach(s=>{$(s).hidden=false})}
function toast(t,ms=4000){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},ms)}

const opts=[];
if(job()==='shipper'&&!G.f.app)opts.push({t:'Mở app nhận đơn',f(){G.f.app=1;snd('ding');toast('Có 3 đơn. Đơn 1: lấy 2 hộp cơm ở quán cơm tấm.',4000)}});
if(job()==='thodien'&&G.f.ppe&&G.f.called===undefined)opts.push({t:'Gọi điều độ, chờ xác nhận đã cắt điện',f(){act('call',2.5,()=>{G.f.called=1;G.f.cut=1;G.min+=15;logx('Gọi điều độ cắt điện trước khi làm','good');say('Điều độ','Đã cắt điện tuyến 3. Làm đi anh.')})}},{t:'Thôi, làm luôn cho nhanh',f(){G.f.called=0;G.f.cut=0;logx('Không xin cắt điện','risk')}});
if((PF.xe==='grabbike'||PF.xe==='grabcar')&&!G.f.booked&&!G.f.arrived&&DOORS.front.open)opts.push({t:'Đặt '+TRANS[PF.xe],f(){G.f.booked=1;later(5,()=>callRide(PF.xe))}});
if(G.f.momMsg&&!G.f.called2){const who=G.f.momMsg;opts.push({t:'Gọi lại cho '+who,f(){act('call',3,()=>{G.f.called2=1;logx('Gọi lại cho '+who,'good');talk(who,'Ừ, nhớ giữ sức khỏe nghe con.')})}})}

<script>
// ===== Điều khiển =====
const keys={},padK={};
const GAMEKEYS=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight'];

if(e.code==='Space')jump()});

function jump(){if(P.ground&&!P.busy&&!P.veh&&!(P.ride&&P.ride.on)&&(G.mode==='day'||G.mode==='after')){P.vy=7.4;if(G.tut)G.tut.jump=true}}

b.addEventListener('pointerdown',e=>{e.preventDefault();padK[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}});

cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);

$('#ta').onclick=()=>useItem();$('#tj').onclick=()=>jump();$('#tq').onclick=()=>phone();$('#tbag').onclick=()=>toggleInv();

function toggleInv(){if(G.mode!=='day')return;const e=$('#inv');renderInv();e.hidden=!e.hidden}
const ray=new THREE.Raycaster(),v2=new THREE.Vector2(),v3=new THREE.Vector3(),gPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function itemPos(i){if(i.pos)return i.pos();if(i.npc!==undefined){const g=NPCS[i.npc];if(g)return [g.position.x,g.position.z]}return [i.x,i.z]}
function activeItems(){return G.items.filter(i=>!i.on||i.on())}
function clickAt(cx,cy){if((G.mode!=='day'&&G.mode!=='after')||P.busy||G.dlg||P.veh||(P.ride&&P.ride.on&&P.ride.stage!=='fish'))return;let best=null,bd=56;
activeItems().forEach(i=>{const [x,z]=itemPos(i);v3.set(x,(i.y||1.8)-.6,z).project(camera);if(v3.z>1)return;const d=Math.hypot((v3.x+1)/2*innerWidth-cx,(1-v3.y)/2*innerHeight-cy);if(d<bd){bd=d;best=i}});
if(best){if(P.ride&&P.ride.on){useItem(best);return}const [x,z]=itemPos(best);P.goto={x,z,item:best,t:0};return}
if(P.ride&&P.ride.on)return;v2.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(v2,camera);gPlane.constant=-P.y;if(ray.ray.intersectPlane(gPlane,v3))P.goto={x:v3.x,z:v3.z,item:null,t:0}}
function nearest(){let best=null,bd=P.veh?3.5:2.4;if(P.ride&&P.ride.on)bd=4;activeItems().forEach(i=>{const [x,z]=itemPos(i);const d=Math.hypot(x-P.x,z-P.z);if(d<bd&&Math.abs((i.y||1.8)-1.6-P.y)<3.5){bd=d;best=i}});return best}
function useItem(n){if((G.mode!=='day'&&G.mode!=='after')||G.dlg||P.busy)return;n=n||nearest();if(!n)return;const [x,z]=itemPos(n);G.anchor=new THREE.Vector3(x,n.y||1.8,z);n.use()}
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));

// ===== Xe: AI chạy theo làn, người chơi tự lái =====
function vehStep(dt){const ob=[];if(P.veh)ob.push({x:P.veh.m.position.x,z:P.veh.m.position.z,hl:P.veh.hl});if(P.ride&&P.ride.m&&P.ride.kind!=='boat')ob.push({x:P.ride.m.position.x,z:P.ride.m.position.z,hl:P.ride.hl});
VEH.forEach(v=>{const x=v.m.position.x,front=x+v.d*v.hl;let tgt=v.max;
if(LIGHT.on&&LIGHT.car!=='g'){if(v.d>0&&front<CW[0]+.3&&front>CW[0]-9)tgt=Math.min(tgt,Math.max(0,(CW[0]-.4-front)*1.4));if(v.d<0&&front>CW[1]+.7&&front<CW[1]+10)tgt=Math.min(tgt,Math.max(0,(front-CW[1]-1.4)*1.4))}
VEH.forEach(o=>{if(o===v||o.d!==v.d||Math.abs(o.z-v.z)>.8)return;const gap=(o.m.position.x-x)*v.d-o.hl-v.hl;if(gap>0&&gap<5)tgt=Math.min(tgt,Math.max(0,(gap-1.2)*1.6))});
ob.forEach(o=>{if(Math.abs(o.z-v.z)>1.2)return;const gap=(o.x-x)*v.d-o.hl-v.hl;if(gap>0&&gap<6)tgt=Math.min(tgt,Math.max(0,(gap-1.4)*1.6))});
v.s=tgt<v.s?Math.max(tgt,v.s-dt*14):v.s+(tgt-v.s)*Math.min(1,dt*2);v.m.position.x+=v.d*v.s*dt;
if(v.m.position.x>104)v.m.position.x=-24;if(v.m.position.x<-24)v.m.position.x=104;
if(G.mode!=='day')return;
if(!P.veh&&!(P.ride&&P.ride.on)&&Math.abs(v.m.position.x-P.x)<v.hl+.3&&Math.abs(v.m.position.z-P.z)<v.hw+.3&&P.y<1.3&&v.s>1.2){die('car');return}
if(P.veh){const pv=P.veh.m.position,r=P.veh.type==='moto'?.6:P.veh.type==='car'?1.2:1.8;if(Math.abs(v.m.position.x-pv.x)<v.hl+r&&Math.abs(v.m.position.z-pv.z)<v.hw+.45&&Math.abs(v.s*v.d-Math.sin(P.yaw)*P.veh.s)>2.5)crash()}})}
function vehicleStep(dt){const v=P.veh,S=VSPEC[v.type],m=v.m;let thr=0;
if(keys.KeyW||keys.ArrowUp||padK.f)thr=1;if(keys.KeyS||keys.ArrowDown||padK.b)thr=-1;if(P.busy||G.dlg)thr=0;
const steer=((keys.KeyA||keys.ArrowLeft||padK.l||padK.tl)?1:0)-((keys.KeyD||keys.ArrowRight||padK.r||padK.tr)?1:0);
const max=S.max*(G.f.rush?1.25:1)*(RAIN.visible?.85:1);
if(thr>0)v.s=Math.min(max,v.s+S.acc*dt);else if(thr<0)v.s=v.s>0?Math.max(0,v.s-(RAIN.visible?9:14)*dt):Math.max(-2.5,v.s-3*dt);else v.s*=Math.pow(.55,dt);
if(Math.abs(v.s)<.05)v.s=0;
P.yaw+=steer*1.9*dt*Math.min(1,Math.abs(v.s)/3)*(v.s<0?-1:1);
const sn=Math.sin(P.yaw),cs=Math.cos(P.yaw),dir=v.s<0?-1:1,nx=m.position.x+sn*v.s*dt,nz=m.position.z+cs*v.s*dt,fx=nx+sn*v.hl*dir,fz=nz+cs*v.hl*dir;
const bad=([x,z])=>solid.has(key(Math.floor(x),0,Math.floor(z)))||solid.has(key(Math.floor(x),1,Math.floor(z))),edge=([x,z])=>x<bounds[0]+1||x>bounds[1]-1||z<bounds[2]||z>bounds[3]||(WATER&&WATER(x,z));
if(edge([fx,fz])){v.s=0}else if(bad([fx,fz])||bad([nx,nz])){if(Math.abs(v.s)>7)crash('Xe đâm vào vật cản!');v.s=0}
else{if(LIGHT.on&&LIGHT.car==='r'&&!G.f.redRun&&m.position.z>0&&m.position.z<8.5){const px=m.position.x;
if((sn>.5&&px+v.hl<CW[0]&&nx+v.hl>=CW[0])||(sn<-.5&&px-v.hl>CW[1]+1&&nx-v.hl<=CW[1]+1)){G.f.redRun=1;logx('Vượt đèn đỏ','risk');snd('horn');if(Math.random()<RISK.redRun)later(.4,()=>crash('Một chiếc xe từ đường ngang lao ra!'));else toast('Vượt đèn đỏ! Suýt nữa…',2200)}}
m.position.x=nx;m.position.z=nz}
m.rotation.y=P.yaw-Math.PI/2;P.x=m.position.x;P.z=m.position.z;P.y=0;
if(!G.f.arrived&&JOBS_LOGIC[job()].commute!==false&&near(dest(),5)&&Math.abs(v.s)<1.5){dismount();toast('Tới nơi.',1500)}}

// ===== Bản đồ nhỏ =====
function drawMini(tgt){const c=$('#mini'),g=c.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#2a2430';g.fillRect(0,0,150,110);

// ===== Giờ, trời =====
const SKY=[[240,0x1b2236,.32,.08],[330,0x3a3a5a,.45,.2],[390,0xf2d6c0,.75,.5],[480,0xcfe3ea,.85,.7],[720,0xa8d4ec,.95,.8],[1020,0xe0a878,.75,.55],[1110,0x7a5a7a,.5,.25],[1200,0x1b2236,.32,.08],[1440,0x1b2236,.32,.08]];

skyMat.uniforms.bot.value.copy(ca);skyMat.uniforms.top.value.copy(ca).lerp(cb.setHex(m<1100&&m>330?0x3f78c0:0x1a1f3a),.55);cloudMat.color.copy(ca).lerp(cb.setHex(0xffffff),RAIN.visible?.2:.7)}
function shaded(){for(let y=2;y<12;y++)if(blocks.has(key(Math.floor(P.x),y,Math.floor(P.z))))return true;return false}

// ===== Vòng lặp =====
let last=performance.now(),miniT=0,idle=0,lastQi=-1;
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.1,(now-last)/1000);last=now;step(dt,now)}
// Một bước mô phỏng; tách riêng để có thể tua nhanh khi kiểm thử.
function step(dt,now){
if(G.mode==='black'||G.mode==='fade')return;
const live=G.mode==='day'||G.mode==='after';
CLOUDS.forEach(g=>{g.position.x+=dt*1.2;if(g.position.x>170)g.position.x=-70});rainStep(dt);
if(G.storm&&Math.random()<dt*.18)flash();
if(G.mode==='day'||G.mode==='menu'){lightStep(dt);vehStep(dt);if(G.mode==='menu')return render(now);
(NPCS.walkers||[]).forEach(w=>{w.position.x+=w.d*1.3*dt;if(w.position.x>98)w.position.x=-18;if(w.position.x<-18)w.position.x=98;const s=Math.sin(now*.009+w.d)*.6;w.lL.rotation.x=s;w.lR.rotation.x=-s;w.aL.rotation.x=-s;w.aR.rotation.x=s})}
if(G.mode==='day'){
G.min+=dt;$('#clock').textContent=fmt(G.min)+(RAIN.visible?' · mưa':G.wx==='nong'?' · nắng nóng':'');sky(G.min);
const due=[];G.timers=G.timers.filter(t=>{t.t-=dt;if(t.t<=0){due.push(t);return false}return true});due.forEach(t=>t.f());if(G.mode!=='day')return;
if(G.rainAt&&G.min>=G.rainAt&&!G.rained){G.rained=1;RAIN.visible=true;toast('Trời đổ mưa. Đường trơn.',3000)}
const L=JOBS_LOGIC[job()];
if(L.outdoor&&!P.veh&&!(P.ride&&P.ride.on)&&G.floor===0){const hot=G.min>600&&G.min<960&&(G.wx==='nong'||G.wx==='nang')&&!RAIN.visible;
if(hot&&!shaded())G.heat=Math.min(100,G.heat+dt*(G.wx==='nong'?1.5:.6)*(PF.tuoi>=55?1.3:1)*(runOn||keys.ShiftLeft?1.3:1));else G.heat=Math.max(0,G.heat-dt*2);
if(G.heat>=100&&!G.f.heatHit&&!P.busy&&!G.dlg)heatEvent()}
if(L.hook)L.hook(dt);if(G.mode!=='day')return;
rideStep(dt);
const tgt=questStep();if(G.qi!==lastQi){lastQi=G.qi;idle=0;if(G.qi===G.sudden&&!P.veh){G.sudden=-1;cv.style.filter='blur(2px) grayscale(.6)';snd('beat');say('','Ngực… đau quá…');later(1.6,()=>die('cardiac'))}}
const onRoad=P.z>=0&&P.z<=8&&G.floor===0&&!P.veh&&!(P.ride&&P.ride.on);if(onRoad&&LIGHT.on&&LIGHT.ped!=='g'&&!G.f.jay){G.f.jay=1;logx(P.x>=CW[0]&&P.x<=CW[1]?'Qua đường khi đèn đi bộ chưa xanh':'Băng qua đường không có vạch kẻ','risk')}
const mk=PROPS.mark;mk.visible=!!tgt&&Math.hypot(tgt[0]-P.x,tgt[1]-P.z)>1.8;if(mk.visible){mk.position.set(tgt[0],(G.floor===12||P.z>14&&P.z<26?2.7:3.6)+Math.sin(now*.004)*.2+(tgt[2]||0),tgt[1]);mk.rotation.y=now*.002}
const dx0=tgt?tgt[0]-P.x:0,dz0=tgt?tgt[1]-P.z:0,dl=Math.hypot(dx0,dz0);
PROPS.trail.forEach((d,i)=>{const s=1.4+i*1.3;d.visible=!!tgt&&s<dl-.8&&!P.veh&&!(P.ride&&P.ride.on);if(d.visible){d.position.set(P.x+dx0/dl*s,(P.y>0?P.y:0)+.04,P.z+dz0/dl*s);d.material.opacity=.35+.45*Math.max(0,Math.sin(now*.006-i*.7))}});
idle+=dt;if(idle>20&&tgt&&!G.dlg){idle=0;toast('Gợi ý: đi theo vệt sáng và mũi tên vàng. Lại gần rồi bấm '+(TOUCH?'nút sáng màu':'E')+'.',4500)}
if((miniT+=dt)>.15){miniT=0;drawMini(tgt)}}
if(G.mode==='after'){sun.position.set(P.x+50,30,P.z-15);sun.target.position.set(P.x,0,P.z)}
let l=0;
if(live&&P.busy){P.busy.t-=dt;if(P.busy.t<=0){const d=P.busy.done;P.busy=null;if(d)d()}}
if(G.mode!=='day'&&G.mode!=='after')return render(now);
if(P.ride&&P.ride.on){P.y=P.ride.kind==='boat'?.95:0}
else if(P.veh){if(!P.busy)vehicleStep(dt)}
else if(live&&!P.busy){
let fx=0,fz=0;
if(keys.KeyW||keys.ArrowUp||padK.f)fz+=1;if(keys.KeyS||keys.ArrowDown||padK.b)fz-=1;if(keys.KeyA||padK.l)fx-=1;if(keys.KeyD||padK.r)fx+=1;
const turn=(keys.ArrowLeft||padK.tl?1:0)-(keys.ArrowRight||padK.tr?1:0);P.yaw+=turn*2.4*dt;
if(fx||fz||turn){P.goto=null;idle=0}
if(P.goto){const g=P.goto,dx=g.x-P.x,dz=g.z-P.z,d=Math.hypot(dx,dz);
if(d<(g.item?1.7:.35)){P.goto=null;if(g.item)useItem(g.item)}
else{const df=wrap(Math.atan2(dx,dz)-P.yaw);P.yaw+=clamp(df,-7*dt,7*dt);fz=Math.abs(df)<1?1:.15;g.t+=dt;if(g.t>30)P.goto=null}}
l=Math.hypot(fx,fz);if(l>1){fx/=l;fz/=l}
const run=keys.ShiftLeft||keys.ShiftRight||runOn,sp=(G.mode==='after'?3.4:4.4)*(run?1.6:1);
const sn=Math.sin(P.yaw),cs=Math.cos(P.yaw),mx=(sn*fz-cs*fx)*sp*dt,mz=(cs*fz+sn*fx)*sp*dt;
if(G.tut){if(fz>0)G.tut.fwd+=sp*dt*fz;if(fx)G.tut.side+=sp*dt*Math.abs(fx)}
let blocked=false;if(!hit(P.x+mx,P.y,P.z))P.x+=mx;else blocked=true;if(!hit(P.x,P.y,P.z+mz))P.z+=mz;else blocked=true;
if(blocked&&P.ground&&(mx||mz)&&!hit(P.x+Math.sign(mx)*.15,P.y+1.05,P.z+Math.sign(mz)*.15))P.vy=7.4}
if(live&&!P.veh&&!(P.ride&&P.ride.on)){
P.vy-=22*dt;let ny=P.y+P.vy*dt;P.ground=false;const fallV=P.vy;
if(ny<=0){ny=0;P.vy=0;P.ground=true}else if(hit(P.x,ny,P.z)){if(P.vy<0){ny=Math.ceil(ny);P.ground=true}else ny=P.y;P.vy=0}
if(P.ground&&fallV<-12.5&&G.mode==='day'){P.y=ny;die('fall');return render(now)}
P.y=ny}
if(P.mesh&&live){const moving=l>.05;P.walk+=moving?dt*9*(runOn||keys.ShiftLeft?1.5:1):0;const sw=moving?Math.sin(P.walk)*.65:0;
if(P.busy)pose(P.mesh,P.busy.pose,now);else if(P.veh||P.ride&&P.ride.on)pose(P.mesh,P.ride&&P.ride.kind==='boat'?'sway':'ride',now);
else{P.mesh.rotation.x=0;P.mesh.rotation.z=0;P.mesh.aL.rotation.z=P.mesh.aR.rotation.z=0;P.mesh.aL.rotation.x=sw;P.mesh.aR.rotation.x=P.held?-.5:-sw;P.mesh.lL.rotation.x=-sw;P.mesh.lR.rotation.x=sw}}
if(live){const n=P.busy||G.dlg?null:nearest(),pr=$('#prompt'),ta=$('#ta');
if(n){pr.hidden=false;pr.textContent=(TOUCH?'':'E: ')+n.hint;ta.textContent=n.verb;ta.classList.add('has')}else{pr.hidden=true;ta.textContent=P.veh?'Xe':'Hành động';ta.classList.remove('has')}
NPCS.forEach(g=>{if(g.d)return;const dx=P.x-g.position.x,dz=P.z-g.position.z;if(dx*dx+dz*dz<30&&G.mode==='day'&&g.position.y<1)g.rotation.y+=wrap(Math.atan2(dx,dz)-g.rotation.y)*Math.min(1,dt*5)})}
render(now)}
function render(now){
const sn=Math.sin(P.yaw),cs=Math.cos(P.yaw);
if(P.mesh){let px=P.x,py=P.y,pz=P.z,vis=!(P.first&&(G.mode==='day'||G.mode==='after'));
if(P.veh){if(P.veh.type==='moto'){px-=sn*.15;pz-=cs*.15;py=.38}else vis=false}
else if(P.ride&&P.ride.on){if(P.ride.kind==='grabbike'){px-=sn*.55;pz-=cs*.55;py=.42}else if(P.ride.kind!=='boat')vis=false}
else if(P.busy&&['sit','kneel','pray','bow'].includes(P.busy.pose))py-=.5;
P.mesh.position.set(px,py,pz);P.mesh.rotation.y=P.yaw;P.mesh.visible=vis}
const h=P.h-.15,dx=sn*Math.cos(P.pitch),dy=Math.sin(P.pitch),dz=cs*Math.cos(P.pitch);
if(G.mode==='menu'){const a=now*.0004,wide=innerWidth>=760,o=wide?1.1:0;camera.position.set(P.x+o+Math.sin(a)*.4,P.y+1.45,P.z+3.2);camera.lookAt(P.x+o,P.y+(wide?1.05:.45),P.z)}
else if(G.mode==='review'||G.mode==='end'){const a=now*.00012;camera.position.set(7+Math.cos(a)*26,18,20+Math.sin(a)*26);camera.lookAt(7,0,18)}
else if(P.first&&!P.veh){camera.position.set(P.x,P.y+h,P.z);camera.lookAt(P.x+dx,P.y+h+dy,P.z+dz)}
else{const inV=P.veh||(P.ride&&P.ride.on&&P.ride.kind!=='grabbike');const big=P.veh&&P.veh.type==='truck'||P.ride&&(P.ride.kind==='bus'||P.ride.kind==='shuttle');
const up=(camera.aspect<1?.9:.45)+(inV?1.2:0)+(big?1.2:0),mx=(camera.aspect<1?5.5:5)+(inV?2.5:0)+(big?3:0);let d=.5;
while(d<mx){const cx=P.x-dx*d,cy=P.y+h-dy*d+up,cz=P.z-dz*d,k=key(Math.floor(cx),Math.floor(cy),Math.floor(cz));if(solid.has(k)||cy<.2||blocks.has(k))break;d+=.15}
d=Math.max(.4,d-.2);camera.position.set(P.x-dx*d,P.y+h-dy*d+up,P.z-dz*d);camera.lookAt(P.x+dx*2,P.y+h+dy-up*.35,P.z+dz*2)}
camera.rotation.z+=G.tilt?Math.sin(now*.002)*G.tilt:0;if(G.storm&&P.ride&&P.ride.kind==='boat')camera.position.y+=Math.sin(now*.003)*.4;
dome.position.copy(camera.position);
if(G.bub){const b=$('#bub');if(now>G.bub.until||(G.dlg&&Math.hypot(G.bub.px-P.x,G.bub.pz-P.z)>6))closeTalk();
else{const a=G.bub.at;if(a)v3.copy(a);else v3.set(P.x,P.y+P.h+.3,P.z);v3.project(camera);
if(v3.z>1)b.hidden=true;else{b.hidden=false;b.style.left=clamp((v3.x+1)/2*innerWidth,90,innerWidth-90)+'px';b.style.top=Math.max(70,(1-v3.y)/2*innerHeight-8)+'px'}}}
renderer.render(scene,camera)}
PF=loadPF();wizard();requestAnimationFrame(tick);
</script>
